  }

  /* ---------- manche de décision asymétrique ----------
     Le moteur reste inchangé. Chaque poste ne verrouille que la partie
     de la décision qui lui appartient, puis l'hôte fusionne les deux. */
  var round = {
    key: null,
    localSubmitted: false,
    remoteSubmitted: false,
    localDec: null,
    remoteDec: null,
    remotePoste: null
  };

  function roundKey() {
    return (st && cr) ? [save.seed, st.annee, st.session].join('|') : null;
  }

  function roleForIndex(crise, idx, role) {
    if (!crise) return false;
    if (role === 'demo') return true;
    if (crise.type === 'thermique') {
      var nbm = crise.mods.length;
      if (idx < nbm) return role === 'tech';
      if (idx < nbm + crise.eq.length) return role === 'equipage';
      return role === 'tech';
    }
    if (crise.type === 'diagnostic') {
      if (idx === 0) return role === 'equipage';
      if (idx === 1) return role === 'tech';
      return role === 'equipage';
    }
    if (crise.type === 'evenement') {
      // Les événements possèdent deux décisions dédiées : technique puis équipage.
      // Le dernier index reste le plan de semaine, porté par le poste équipage.
      if (idx === 0) return role === 'tech';
      return role === 'equipage';
    }
    if (idx < (crise.taches || []).length) {
      return ['mecanique', 'electricite', 'soudure'].indexOf(crise.taches[idx].sk) >= 0
        ? role === 'tech' : role === 'equipage';
    }
    return role === 'equipage';
  }

  function indicesDuRole(crise, role) {
    var out = [];
    if (!crise || !role) return out;
    for (var i = 0; i < crise.widths.length; i++) {
      if (roleForIndex(crise, i, role)) out.push(i);
    }
    return out;
  }

  function initialiserRound(force) {
    if (!cr) {
      round.key = null;
      round.localSubmitted = false;
      round.remoteSubmitted = false;
      round.localDec = null;
      round.remoteDec = null;
      dec = null;
      return;
    }
    var k = roundKey();
    if (!k) return;
    if (force || round.key !== k) {
      round = {
        key: k,
        localSubmitted: false,
        remoteSubmitted: false,
        localDec: cr.defaut.slice(),
        remoteDec: null,
        remotePoste: net.remotePoste || null
      };
      if (save.pendingLocal && save.pendingLocal.key === k && Array.isArray(save.pendingLocal.values)) {
        var idxs = indicesDuRole(cr, save.poste);
        save.pendingLocal.values.forEach(function (v) {
          if (idxs.indexOf(v.i) >= 0) round.localDec[v.i] = v.v;
        });
        round.localSubmitted = !!save.pendingLocal.submitted;
      }
    }
    if (!round.localDec || round.localDec.length !== cr.defaut.length) round.localDec = cr.defaut.slice();
    dec = round.localDec;
  }

  function roundSnapshot() {
    initialiserRound(false);
    if (!round.key) return null;
    var hostValues = [], guestValues = [];
    if (cr) {
      var hostRole = save.p2pRole === 'demo' ? null : save.poste;
      var guestRole = net.remotePoste || null;
      if (hostRole) indicesDuRole(cr, hostRole).forEach(function (i) { hostValues.push({ i:i, v:round.localDec[i] }); });
      if (guestRole && round.remoteDec) indicesDuRole(cr, guestRole).forEach(function (i) { guestValues.push({ i:i, v:round.remoteDec[i] }); });
    }
    return {
      key: round.key,
      hostReady: net.role === 'host' ? !!round.localSubmitted : !!round.remoteSubmitted,
      guestReady: net.role === 'host' ? !!round.remoteSubmitted : !!round.localSubmitted,
      hostPoste: save.p2pRole === 'host' ? save.poste : (net.remotePoste || null),
      guestPoste: save.p2pRole === 'guest' ? save.poste : (net.remotePoste || null),
      hostValues: hostValues, guestValues: guestValues
    };
  }

  function appliquerBrouillonDistant(values, role, key) {
    if (!cr || key !== roundKey() || !Array.isArray(values) || !role) return false;
    var expected = indicesDuRole(cr, role);
    var base = (round.remoteDec && round.remoteDec.length === cr.defaut.length) ? round.remoteDec.slice() : cr.defaut.slice();
    var seen = {};
    for (var i = 0; i < values.length; i++) {
      var item = values[i];
      if (!item || expected.indexOf(item.i) < 0 || seen[item.i]) return false;
      var width = cr.widths[item.i];
      var max = (1 << width) - 1;
      if (!Number.isInteger(item.v) || item.v < 0 || item.v > max) return false;
      seen[item.i] = true;
      base[item.i] = item.v;
    }
    for (var j = 0; j < expected.length; j++) if (!seen[expected[j]]) return false;
    round.remoteDec = base;
    round.remotePoste = role;
    return true;
  }

  function sauvegarderPendingLocal() {
    if (!round.key || !cr) return;
    var idxs = indicesDuRole(cr, save.poste);
    save.pendingLocal = {
      key: round.key,
      submitted: !!round.localSubmitted,
      values: idxs.map(function (i) { return { i: i, v: round.localDec[i] }; })
    };
    enregistrer();
  }

  function effacerPendingLocal() {
    save.pendingLocal = null;
    enregistrer();
  }

  function accepterSoumissionDistante(values, role, key) {
    if (!cr || !role) return false;
    if (key && key !== roundKey()) return false;
    if (!Array.isArray(values) || values.length !== cr.defaut.length) return false;
    var expected = indicesDuRole(cr, role);
    var base = cr.defaut.slice();
    for (var i = 0; i < values.length; i++) {
      if (!Number.isInteger(values[i])) return false;
      var max = (1 << cr.widths[i]) - 1;
      if (values[i] < 0 || values[i] > max) return false;
    }
    for (var j = 0; j < expected.length; j++) {
      var idx = expected[j];
      base[idx] = values[idx];
    }
    round.remoteDec = base;
    round.remotePoste = role;
    round.remoteSubmitted = true;
    return true;
  }

  function decisionCombinee() {
    if (!round.localDec || !round.remoteDec || !round.remotePoste) return null;
    var out = round.localDec.slice();
    indicesDuRole(cr, round.remotePoste).forEach(function (i) { out[i] = round.remoteDec[i]; });
    return out;
  }

  function roundStateMeta() {
    initialiserRound(false);
    var local = !!round.localSubmitted, remote = !!round.remoteSubmitted;
    if (!net.connected) return { cls:'offline', label:'MODE LOCAL', text:'Connexion absente · la transmission manuelle reste disponible.' };
    if (local && remote) return { cls:'ready', label:'RÉSOLU', text:'Les deux postes sont verrouillés. La station va appliquer la décision.' };
    if (local) return { cls:'waiting', label:'EN ATTENTE', text:'Ta décision est verrouillée. Ton partenaire doit encore valider son poste.' };
    if (remote) return { cls:'your-turn', label:'À TOI', text:'Le partenaire a verrouillé sa partie. Termine la tienne pour résoudre la crise.' };
    return { cls:'active', label:'À TOI', text:'Prépare uniquement les décisions qui appartiennent à ton poste.' };
  }

  function phaseCriseUI() {
    var meta = roundStateMeta();
    var labels = ['RAPPORT','PRÉPARATION','VERROUILLAGE','RÉSOLUTION'];
    var current = meta.cls === 'ready' ? 4 : meta.cls === 'waiting' ? 3 : (meta.cls === 'your-turn' || meta.cls === 'active') ? 2 : 1;
    var bar = H('div',{class:'boree-phasebar','aria-label':'Progression de la crise'});
    labels.forEach(function(label,i){
      var n=i+1, cls=n<current?'done':n===current?'current':'';
      bar.appendChild(H('div',{class:'boree-phase '+cls}, H('span',{class:'boree-phase-num',text:String(n)}), H('span',{class:'boree-phase-label',text:label})));
    });
    return H('div',{class:'boree-crise-status '+meta.cls},
      H('div',{class:'boree-status-main'}, H('strong',{text:meta.label}), H('span',{text:meta.text})), bar
    );
  }

  /*
   * Mise à jour ciblée de l'état de manche : uniquement du texte, jamais de
   * reconstruction du DOM. Un paquet réseau ne doit pas détruire les boutons
   * que le joueur est en train de toucher (bug historique « téléphone qui chauffe »).
   */
  function majStatutManche() {
    if (!st || !cr) return;
    var meta;
    try { meta = roundStateMeta(); } catch (e) { return; }
    try {
      var lignes = document.querySelectorAll('.boree-turnline');
      for (var i = 0; i < lignes.length; i++) {
        var l = lignes[i];
        l.className = 'boree-turnline ' + meta.cls;
        var lf = l.querySelector('strong'), ls = l.querySelector('span');
        if (lf) lf.textContent = meta.label;
        if (ls) ls.textContent = meta.text;
      }
      var att = document.querySelector('.boree-wait-state');
      if (att) {
        var af = att.querySelector('strong'), as = att.querySelector('span');
        if (af) af.textContent = (round.localSubmitted && round.remoteSubmitted) ? 'RÉSOLUTION EN COURS' : 'EN ATTENTE DU PARTENAIRE';
        if (as) as.textContent = roundReadyText();
      }
    } catch (e) {}
  }

  function roundReadyText() {
    if (!cr) return net.connected ? 'En attente de la synchronisation du prochain hiver.' : 'Connexion absente.';
    initialiserRound(false);
    if (!net.connected) return 'Connexion absente.';
    if (round.localSubmitted && round.remoteSubmitted) return 'Les deux décisions sont verrouillées. Résolution…';
    if (round.localSubmitted) return 'Ta partie est verrouillée. En attente du partenaire.';
    if (round.remoteSubmitted) return 'Le partenaire a validé sa partie. À toi de verrouiller la tienne.';
    return 'Chacun prépare sa partie de la décision.';
  }

  function roundSubmitValues() {
    initialiserRound(false);
    return indicesDuRole(cr, save.poste).map(function (i) { return { i: i, v: round.localDec[i] }; });
  }

  function p2pResendPending() {
    if (net.role !== 'guest' || !net.connected || !save.pendingLocal || !cr) return false;
    if (save.pendingLocal.key !== roundKey() || !save.pendingLocal.submitted) return false;
    return p2pSend({ type: 'submit', key: roundKey(), poste: save.poste, dec: (function(){ var a=cr.defaut.slice(); (save.pendingLocal.values||[]).forEach(function(v){ a[v.i]=v.v; }); return a; })() });
  }

  function p2pStartSubmitRetry() {
    try { if (net.submitRetryTimer) clearInterval(net.submitRetryTimer); } catch (e) {}
    net.submitRetryTimer = null;
    if (net.role !== 'guest' || !net.connected) return;
    net.submitRetries = 0;
    net.submitRetryTimer = setInterval(function () {
      if (!net.connected || !save.pendingLocal || !save.pendingLocal.submitted || !cr || save.pendingLocal.key !== roundKey()) {
        p2pStopSubmitRetry();
        return;
      }
      net.submitRetries++;
      if (net.submitRetries > 12) {
        /* Sortie déterministe : plutôt que de retransmettre sans fin, on
           redemande un état complet à l'hôte. */
        p2pStopSubmitRetry();
        p2pSend({ type: 'hello', seed: save.seed || null, poste: save.poste || null, protocol: 4 });
        return;
      }
      p2pResendPending();
    }, 1400);
  }

  function p2pStopSubmitRetry() {
    try { if (net.submitRetryTimer) clearInterval(net.submitRetryTimer); } catch (e) {}
    net.submitRetryTimer = null;
    net.submitRetries = 0;
  }

  /*
   * Filet de sécurité borné : une fois la décision de l'invité acceptée, le
   * résultat peut encore se perdre. Toutes les 4 s, au plus 8 fois, on
   * redemande l'état à l'hôte au lieu de rester bloqué sur « transmission ».
   * Aucun flux continu, sortie déterministe garantie.
   */
  function p2pStopResyncWatch() {
    try { if (net.resyncTimer) clearInterval(net.resyncTimer); } catch (e) {}
    net.resyncTimer = null;
    net.resyncTries = 0;
  }

  function p2pStartResyncWatch() {
    p2pStopResyncWatch();
    if (net.role !== 'guest' || !net.connected || !cr) return;
    var cle = roundKey();
    if (!cle) return;
    net.resyncTimer = setInterval(function () {
      if (net.role !== 'guest' || !net.connected || !cr || roundKey() !== cle || !round.localSubmitted) {
        p2pStopResyncWatch();
        return;
      }
      net.resyncTries++;
      if (net.resyncTries > 8) { p2pStopResyncWatch(); p2pSetStatus(); return; }
      p2pSend({ type: 'hello', seed: save.seed || null, poste: save.poste || null, protocol: 4 });
    }, 4000);
  }

  function p2pSnapshot(extra) {
    var m = {
      type: 'snapshot',
      seed: save.seed,
      decisions: (save.decisions || []).slice(),
      hostPoste: save.poste || null,
      stateCode: save.seed ? B.stateCode(save) : null,
      round: roundSnapshot(), skillOps:(save.skillOps||[]).slice(),
      remotePoste: net.remotePoste || null
    };
    if (extra) Object.keys(extra).forEach(function (k) { m[k] = extra[k]; });
    return m;
  }

  /*
   * Un instantané n'est émis que si son contenu a réellement changé.
   * Sans ce garde-fou, un échange role/snapshot peut boucler indéfiniment
   * et saturer les deux téléphones.
   */
  function p2pSendSnapshot(force) {
    if (net.role !== 'host') return;
    var m = p2pSnapshot();
    var sig = [m.seed, (m.decisions || []).length, m.stateCode, m.hostPoste || '-', m.remotePoste || '-',
      m.round ? m.round.key : '-', m.round ? (m.round.hostReady ? 1 : 0) : '-', m.round ? (m.round.guestReady ? 1 : 0) : '-'].join('/');
    var maintenant = Date.now();
    if (!force && sig === net.lastSnapshotSig && (maintenant - net.lastSnapshotAt) < 2000) return;
    net.lastSnapshotSig = sig;
    net.lastSnapshotAt = maintenant;
    p2pSend(m);
  }

  function p2pBindConnection(conn, incoming) {
    if (net.conn && net.conn !== conn) {
      if (incoming) {
        /* Borée se joue à deux : une connexion entrante remplace toujours
           l'ancienne. Sans cela, un invité qui recharge sa page (nouvel
           identifiant PeerJS) reste rejeté tant que l'hôte croit l'ancienne
           liaison encore ouverte. */
        var ancienne = net.conn;
        net.conn = null;
        try { ancienne.close(); } catch (e) {}
      } else {
        try { conn.close(); } catch (e) {}
        return;
      }
    }
    net.conn = conn;
    net.connecting = true;
    conn.on('open', function () {
      net.connected = true;
      net.connecting = false;
      try { if (net.retryTimer) clearTimeout(net.retryTimer); } catch (e) {}
      net.retryTimer = null;
      p2pSetStatus();
      if (net.role === 'host') {
        net.snapshotAck = false;
        net.lastSnapshotSig = null;
        p2pSendSnapshot(true);
        /* La liaison revient alors que l'hôte est sur l'écran de secours
           « code manuel » : il doit pouvoir verrouiller en P2P. */
        if (ecranCourant === 'transmission' && cr && !round.localSubmitted) {
          rendreCrise(); aller('crise');
        }
      } else {
        p2pSend({ type: 'hello', seed: save.seed || null, poste: save.poste || null, protocol: 4 });
        setTimeout(function(){
          if (p2pResendPending()) { p2pStartSubmitRetry(); p2pStartResyncWatch(); }
        }, 120);
      }
    });
    conn.on('data', p2pHandleMessage);
    conn.on('close', function () {
      if (net.conn !== conn) return;
      try { if (net.snapshotTimer) clearInterval(net.snapshotTimer); } catch (e) {}
      net.snapshotTimer = null;
      net.snapshotAck = false;
      net.lastSnapshotSig = null;
      net.conn = null;
      net.connected = false;
      net.connecting = false;
      p2pStopSubmitRetry();
      p2pStopResyncWatch();
      p2pSetStatus();
      if (net.role === 'guest') p2pScheduleGuestRetry(900);
    });
    conn.on('error', function () {
      if (net.conn !== conn) return;
      net.connected = false;
      net.connecting = false;
      p2pSetStatus();
    });
  }

  function p2pHostAccept(conn) {
    if (net.role !== 'host') return;
    p2pBindConnection(conn, true);
  }

  function p2pConnectToHost() {
    if (net.role !== 'guest' || !save.hostPeerId || !net.peer || net.peer.destroyed) return;
    if (net.conn && (net.conn.open || net.connecting)) return;
    net.connecting = true;
    p2pSetStatus();
    try {
      var conn = net.peer.connect(save.hostPeerId, {
        reliable: true,
        metadata: { seed: save.seed || null, poste: save.poste || null }
      });
      p2pBindConnection(conn, false);
    } catch (e) {
      net.connecting = false;
      net.connected = false;
      p2pSetStatus();
      p2pScheduleGuestRetry(900);
    }
  }

  function p2pInit() {
    p2pSaveShape();
    if (!save.p2pRole || !window.Peer) return;
    if (net.peer && !net.peer.destroyed) return;
    net.role = save.p2pRole;
    net.connected = false;
    net.connecting = false;

    try {
      var peerId = net.role === 'host' ? save.hostPeerId : undefined;
      net.peer = peerId ? new Peer(peerId) : new Peer();
    } catch (e) {
      net.peer = null;
      p2pSetStatus();
      return;
    }

    net.peer.on('open', function (id) {
      if (net.role === 'host') save.hostPeerId = id;
      save.peerId = id;
      enregistrer();
      p2pSetStatus();
      if (net.role === 'guest') {
        setTimeout(p2pConnectToHost, 80);
        p2pScheduleGuestRetry(1100);
      }
    });
    net.peer.on('connection', p2pHostAccept);
    net.peer.on('disconnected', function () {
      if (!net.connected) net.connecting = false;
      p2pSetStatus();
      if (net.role === 'host') {
        /* Le serveur de signalisation ferme la socket dès que le téléphone
           passe en veille. Sans reconnexion, plus aucun invité ne peut
           rejoindre ni retrouver la station. */
        try { net.peer.reconnect(); } catch (e) {}
        return;
      }
      if (net.role === 'guest' && save.hostPeerId) {
        try { net.peer.reconnect(); } catch (e) {}
        setTimeout(function () { if (!net.connected) p2pConnectToHost(); }, 350);
        p2pScheduleGuestRetry(1200);
      }
    });
    net.peer.on('error', function (err) {
      net.connecting = false;
      var typeErr = err && err.type ? String(err.type) : '';
      if (net.role === 'host' && typeErr === 'unavailable-id') {
        /* L'identifiant de station est encore occupé par la session
           précédente : on retente le même identifiant, sinon le code
           affiché au binôme ne pointerait plus sur rien. */
        if (net.idRetries < 3) {
          net.idRetries++;
          try { if (net.peer) net.peer.destroy(); } catch (e) {}
          net.peer = null;
          try { if (net.reinitTimer) clearTimeout(net.reinitTimer); } catch (e) {}
          net.reinitTimer = setTimeout(function () { net.reinitTimer = null; p2pInit(); }, 1200 * net.idRetries);
        }
        p2pSetStatus();
        return;
      }
      if (net.role === 'guest') { p2pCloseConn(); p2pScheduleGuestRetry(900); }
      p2pSetStatus();
    });
  }

  function p2pRoleChanged(p) {
    round.key = null;
    save.pendingLocal = null;
    enregistrer();
    if (!save.p2pRole || !net.connected) return;
    p2pSend({ type: 'role', poste: p });
  }

  function p2pHandleSnapshot(msg) {
    if (net.role !== 'guest' || !msg || !msg.seed) return false;
    /* On mémorise ce que le joueur est en train de faire AVANT de remplacer
       l'état : un instantané ne doit jamais lui reprendre son écran ni
       effacer les choix qu'il vient de poser. */
    var ancienneCle = round.key;
    var ancienEcran = ecranCourant;
    var brouillonLocal = (!round.localSubmitted && round.localDec) ? round.localDec.slice() : null;
    /* Repère de situation indépendant de la manche : il reste identique tant
       que la station n'a pas avancé (achat de compétence, reconnexion,
       poignée de main) et change dès qu'une crise est résolue. */
    var situationAvant = st ? [save.seed, st.annee, st.session, st.fini ? 1 : 0].join('|') : null;
    if (net.conn && net.conn.open) {
      net.connected = true;
      net.connecting = false;
    }
    try { if (net.retryTimer) clearTimeout(net.retryTimer); } catch (e) {}
    net.retryTimer = null;

    save.seed = String(msg.seed);
    save.decisions = Array.isArray(msg.decisions) ? msg.decisions.slice() : [];
    save.skillOps = Array.isArray(msg.skillOps) ? msg.skillOps.slice() : [];
    if (msg.hostPoste) net.remotePoste = msg.hostPoste;
    if (!save.hostPeerId && net.conn && net.conn.peer) save.hostPeerId = String(net.conn.peer);
    enregistrer();

    try { recalculer(); } catch (e) {
      p2pSetStatus();
      return false;
    }

    p2pSend({ type: 'snapshot_ack', seed: save.seed, stateCode: B.stateCode(save) });
    /* Le poste n'est réannoncé que si l'hôte ne le connaît pas encore.
       Un envoi systématique relance un instantané, qui relance un « role » :
       c'est exactement la boucle réseau qui faisait chauffer les téléphones. */
    var posteConnu = (msg.remotePoste === save.poste) || !!(msg.round && msg.round.guestPoste === save.poste);
    if (save.poste && !posteConnu) {
      p2pSend({ type: 'role', poste: save.poste });
    }

    if (save.storySeen === false) {
      rendreIntro();
      aller('intro');
      return true;
    }

    initialiserRound(true);
    var memeManche = !!(ancienneCle && round.key && ancienneCle === round.key);
    var situationApres = st ? [save.seed, st.annee, st.session, st.fini ? 1 : 0].join('|') : null;
    var memeSituation = !!(situationAvant && situationApres && situationAvant === situationApres);
    if (!memeSituation) { p2pStopSubmitRetry(); p2pStopResyncWatch(); }
    if (save.p2pRole === 'guest' && save.pendingLocal && save.pendingLocal.key !== round.key) {
      save.pendingLocal = null;
      enregistrer();
      round.localSubmitted = false;
    }
    /* Même manche : on restitue le brouillon en cours de saisie. */
    if (memeManche && brouillonLocal && cr && !round.localSubmitted && brouillonLocal.length === cr.defaut.length) {
      indicesDuRole(cr, save.poste).forEach(function (i) { round.localDec[i] = brouillonLocal[i]; });
      dec = round.localDec;
    }
    if (msg.round && msg.round.key === round.key) {
      round.remoteSubmitted = !!msg.round.hostReady;
      var remoteRole = msg.round.hostPoste && msg.round.hostPoste !== save.poste ? msg.round.hostPoste : (msg.hostPoste && msg.hostPoste !== save.poste ? msg.hostPoste : null);
      if (remoteRole && Array.isArray(msg.round.hostValues)) appliquerBrouillonDistant(msg.round.hostValues, remoteRole, round.key);
    }
    /* Règle absolue : un message réseau ne reconstruit pas l'écran courant.
       On ne navigue que si la manche a réellement changé. */
    if (!save.poste) {
      rendrePoste(); aller('poste');
    } else if (st.fini) {
      if (ecranCourant !== 'fin' && ecranCourant !== 'journal') { rendreFin(); aller('fin'); }
    } else if (!memeSituation) {
      rendreHub(); aller('hub');
    } else if (ancienEcran === 'transmission' && !round.localSubmitted) {
      /* L'invité était sur l'écran de secours : la liaison est revenue. */
      rendreCrise(); aller('crise');
    } else if (ancienEcran === 'progression') {
      rendreProgression();
    } else if (ancienEcran === 'hub') {
      rendreHub();
    }
    majStatutManche();
    p2pSetStatus();
    return true;
  }

  function p2pApplyResolved(msg) {
    if (net.role !== 'guest') return;
    if (!msg || !msg.seed) return;
    save.seed = msg.seed;
    save.decisions = Array.isArray(msg.decisions) ? msg.decisions.slice() : [];
    save.skillOps = Array.isArray(msg.skillOps) ? msg.skillOps.slice() : [];
    save.pendingLocal = null;
    p2pStopSubmitRetry();
    p2pStopResyncWatch();
    enregistrer();
    try { recalculer(); } catch (e) { return; }
    round.key = null;
    if (msg.result && msg.cr) {
      try {
        rendreResolution(msg.result, msg.cr, msg.avant || { integrite: st.integrite, cohesion: st.cohesion });
        aller('resolution');
      } catch (e) {
        try { rendreHub(); aller('hub'); } catch (ignored) {}
      }
      cr = B.crisisFor(st);
      dec = cr ? cr.defaut.slice() : null;
    } else if (st.fini) {
      rendreFin(); aller('fin');
    } else {
      rendreHub(); aller('hub');
    }
  }

  /*
   * Single source of truth for network messages.
   * Keep the switch/order explicit: handshake/snapshot first, submit/resolve
   * second, optional administrative messages last. Unknown messages are ignored.
   */
  function p2pHandleMessage(msg) {
    if (!msg || !msg.type) return;

    if (msg.type === 'snapshot' && net.role === 'guest') {
      p2pHandleSnapshot(msg);
      return;
    }

    if (msg.type === 'snapshot_ack' && net.role === 'host') {
      if (!msg.seed || msg.seed === save.seed) {
        net.snapshotAck = true;
        try { if (net.snapshotTimer) clearInterval(net.snapshotTimer); } catch (e) {}
        net.snapshotTimer = null;
      }
      return;
    }

    if (msg.type === 'hello' && net.role === 'host') {
      if (msg.poste && msg.poste !== save.poste) net.remotePoste = msg.poste;
      /* « hello » est la poignée de main : l'instantané est toujours émis. */
      p2pSendSnapshot(true);
      p2pSetStatus();
      return;
    }

    if (msg.type === 'role' && net.role === 'host') {
      var posteAvant = net.remotePoste;
      if (msg.poste && msg.poste !== save.poste) net.remotePoste = msg.poste;
      /* Un instantané uniquement si l'information a changé : sinon
         role → snapshot → role → snapshot boucle sans fin. */
      if (net.remotePoste !== posteAvant) p2pSendSnapshot(true);
      p2pSetStatus();
      return;
    }

    // Les brouillons ne sont volontairement pas synchronisés en temps réel.
    // La synchronisation intervient uniquement après validation.

    if (msg.type === 'submit' && net.role === 'host') {
      if (!st) return;
      /* L'invité peut être resté sur une manche déjà résolue (message
         « resolved » perdu) : on le resynchronise au lieu de le laisser
         retransmettre indéfiniment et rester bloqué sur « transmission ». */
      if (!cr || st.fini || (msg.key && msg.key !== roundKey())) {
        p2pSend({ type:'submit_ack', key: msg.key || null, accepted:false, resync:true });
        p2pSendSnapshot(true);
        return;
      }
      initialiserRound(false);
      var submitRole = (msg.poste && msg.poste !== save.poste) ? msg.poste : posteOppose(save.poste);
      if (submitRole !== 'tech' && submitRole !== 'equipage') {
        p2pSend({ type:'submit_ack', key:round.key, accepted:false, resync:true });
        p2pSendSnapshot(true);
        return;
      }
      if (!accepterSoumissionDistante(msg.dec, submitRole, msg.key)) {
        p2pSend({ type:'submit_ack', key:round.key, accepted:false, resync:true });
        p2pSendSnapshot(true);
        return;
      }
      net.remotePoste = submitRole;
      p2pSend({ type:'submit_ack', key:round.key, accepted:true, hostReady:!!round.localSubmitted });
      majStatutManche();
      if (round.localSubmitted) roundResolveHost();
      return;
    }

    if (msg.type === 'submit_ack' && net.role === 'guest') {
      if (msg.resync) { p2pStopSubmitRetry(); return; }
      if (!cr || msg.key !== roundKey()) return;
      if (msg.accepted) p2pStopSubmitRetry();
      round.remoteSubmitted = !!msg.hostReady;
      majStatutManche();
      return;
    }

    if (msg.type === 'round_status' && net.role === 'guest') {
      if (!cr || msg.key !== roundKey()) return;
      round.remoteSubmitted = !!msg.hostReady;
      majStatutManche();
      return;
    }

    if (msg.type === 'decision' && net.role === 'host') {
      /* Compatibilité avec les anciennes parties utilisant encore le code. */
      if (!st || !cr || st.fini) return;
      var r = B.readCode(st, cr, msg.code || '');
      if (!r) {
        p2pSend({ type: 'error', message: 'Décision reçue hors synchronisation.' });
        return;
      }
      dec = r.dec;
      appliquer(r.payload);
      return;
    }

    if (msg.type === 'resolved' && net.role === 'guest') {
      p2pApplyResolved(msg);
      return;
    }

    if (msg.type === 'skill_upgrade' && net.role === 'host') {
      if (!st || st.fini || ['tech','equipage','coop'].indexOf(msg.branch)<0) return;
      // Un invité ne peut acheter que les branches qui lui appartiennent
      // (la coopération est partagée). Le serveur hôte reste l'autorité.
      /* Juste après une reconnexion, le poste distant peut ne pas encore être
         renseigné : on retombe sur le poste opposé plutôt que de refuser un
         achat légitime (l'hôte reste l'autorité, buyTalent valide le reste). */
      var posteDistant = net.remotePoste || posteOppose(save.poste);
      var branchAllowed = msg.branch === 'coop' || msg.branch === posteDistant;
      if (!branchAllowed) { p2pSend({type:'error',message:'Branche de compétence non autorisée pour ce poste.'}); return; }
      /* Les deux postes partagent la branche coopération : viser la même
         compétence en même temps n'est pas une erreur, on resynchronise. */
      if (B.talentHas(st, msg.branch, String(msg.id||''))) { p2pSendSnapshot(true); return; }
      var bought=B.buyTalent(st,msg.branch,String(msg.id||''));
      if(!bought.ok){p2pSend({type:'error',message:'Compétence indisponible ou points insuffisants.'});p2pSendSnapshot(true);return;}
      save.skillOps=Array.isArray(save.skillOps)?save.skillOps:[]; save.skillOps.push({branch:msg.branch,id:String(msg.id)}); save.decisions.push('S:'+msg.branch+':'+String(msg.id)); enregistrer();
      p2pSendSnapshot(true);
      /* L'hôte ne doit pas être arraché à son écran par un message réseau :
         on ne rafraîchit que l'écran réellement affiché. */
      if (ecranCourant === 'progression') rendreProgression();
      else if (ecranCourant === 'hub') rendreHub();
      return;
    }

    if (msg.type === 'new_winter' && net.role === 'host') {
      if (!st || st.issue !== 'printemps') return;
      passerHiverLocal(true);
      return;
    }

    if (msg.type === 'error' && net.role === 'guest') {
      alert(msg.message || 'La station a refusé la décision.');
      return;
    }

    if (msg.type === 'ping') p2pSend({ type: 'pong' });
  }

  /*
   * Merge only role-owned decision indices. The engine receives exactly one
   * complete vector, so gameplay remains identical to an offline resolution.
   */
  function roundResolveHost() {
    if (net.role !== 'host' || !cr || !round.localSubmitted || !round.remoteSubmitted) return;
    if (round.key !== roundKey()) return;
    var combined = decisionCombinee();
    if (!combined) return;
    dec = combined.slice();
    var payload = B.packCode(dec, cr.widths);
    var crSauve = cr;
    var decSauve = dec.slice();
    var avant = { integrite: st.integrite, cohesion: st.cohesion };
    round.key = null;
    round.localSubmitted = false;
    round.remoteSubmitted = false;
    round.localDec = null;
    round.remoteDec = null;
    effacerPendingLocal();
    appliquer(payload, false, crSauve, decSauve, avant);
  }

  function validerDecision() {
    if (!cr || !dec) return;
    initialiserRound(false);
    if (net.connected && save.p2pRole !== 'demo') {
      if (round.localSubmitted) return;
      round.localSubmitted = true;
      round.localDec = dec.slice();
      sauvegarderPendingLocal();
      if (net.role === 'host') {
        p2pSend({ type: 'round_status', key: round.key, hostReady: true, guestReady: !!round.remoteSubmitted });
        if (round.remoteSubmitted) roundResolveHost();
        else { rendreTransmissionAttente(); aller('transmission'); }
      } else {
        var submitSent = p2pSend({ type: 'submit', key: round.key, poste: save.poste, dec: round.localDec.slice() });
        if (!submitSent) {
          round.localSubmitted = false;
          sauvegarderPendingLocal();
          p2pSetStatus();
          return;
        }
        p2pStartSubmitRetry();
        p2pStartResyncWatch();
        rendreTransmissionAttente(); aller('transmission');
      }
      return;
    }
    rendreTransmission(); aller('transmission');
  }

  function rendreTransmissionAttente() {
    var box = vide($('ecran-transmission'));
    box.appendChild(H('div', { class: 'pile' },
      H('div', {},

      ),

        H('div', { class: 'boree-wait-dot' }),
        H('div', {},
          H('strong', { text: round.localSubmitted && round.remoteSubmitted ? 'RÉSOLUTION EN COURS' : 'EN ATTENTE DU PARTENAIRE' }),
          H('span', { text: roundReadyText() })
        )
      ),

      H('button', { class: 'btn-large btn-discret', onclick: function () { rendreCrise(); aller('crise'); } }, 'Revenir au rapport')
    ));
  }

  function passerHiverLocal(broadcast) {
    save.decisions.push('*');
    enregistrer();
    recalculer();
    if (broadcast && net.role === 'host' && net.connected) p2pSendSnapshot(true);
    if (st.fini) { rendreFin(); aller('fin'); }
    else { rendreHub(); aller('hub'); }
  }

  function passerHiver() {
    if (net.connected && net.role === 'guest') {
      p2pSend({ type: 'new_winter' });
      rendreTransmissionAttente(); aller('transmission');
      return;
    }
    /* L'hôte doit prévenir l'invité, sinon les deux parties divergent d'un hiver. */
    passerHiverLocal(true);
  }


  function recalculer() {
    st = B.replay(save.seed, save.decisions);
    cr = B.crisisFor(st);
    dec = cr ? cr.defaut.slice() : null;
  }

  /* ---------- neige ---------- */
  function neige() {
    var c = $('neige'), x = c.getContext('2d'), fl = [], w = 0, h = 0;
    var reduit = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function taille() {
      w = c.width = c.offsetWidth * (window.devicePixelRatio > 1 ? 2 : 1);
      h = c.height = c.offsetHeight * (window.devicePixelRatio > 1 ? 2 : 1);
    }
    taille();
    window.addEventListener('resize', taille);
    for (var i = 0; i < 70; i++) fl.push({ x: Math.random(), y: Math.random(), v: 0.0004 + Math.random() * 0.0011, d: 0.0006 + Math.random() * 0.0014, r: 0.5 + Math.random() * 1.4, a: 0.16 + Math.random() * 0.4 });
    function boucle() {
      x.clearRect(0, 0, w, h);
      for (var i = 0; i < fl.length; i++) {
        var f = fl[i];
        f.y += f.v; f.x += f.d;
        if (f.y > 1) { f.y = -0.02; f.x = Math.random(); }
        if (f.x > 1.02) f.x = -0.02;
        x.globalAlpha = f.a;
        x.fillStyle = '#dce6f0';
        x.beginPath();
        x.arc(f.x * w, f.y * h, f.r * (window.devicePixelRatio > 1 ? 2 : 1), 0, 6.283);
        x.fill();
      }
      requestAnimationFrame(boucle);
    }
    if (!reduit) boucle();
  }

  /* ---------- schéma de la station ---------- */
  var NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs) {
    var el = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }
  function schema() {
    var CW = 96, CH = 78, BW = 84, BH = 62, PAD = 10;
    var svg = s('svg', { viewBox: '0 0 ' + (4 * CW + PAD * 2 - 12) + ' ' + (3 * CH + PAD * 2 - 16), role: 'img' });
    svg.setAttribute('aria-label', 'Schéma de la station');
    var mods = Object.keys(st.modules).map(function (k) { return st.modules[k]; });
    function px(m) { return { x: PAD + m.x * CW, y: PAD + (m.y - 1) * CH }; }
    var poste = save.poste;

    // couloirs
    mods.forEach(function (a) {
      mods.forEach(function (b) {
        if (a.id >= b.id) return;
        if (!a.built || !b.built) return;
        var dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
        if (dx + dy !== 1) return;
        var pa = px(a), pb = px(b);
        svg.appendChild(s('line', {
          x1: pa.x + BW / 2, y1: pa.y + BH / 2, x2: pb.x + BW / 2, y2: pb.y + BH / 2,
          stroke: '#233141', 'stroke-width': 7, 'stroke-linecap': 'square'
        }));
      });
    });

    mods.forEach(function (m) {
      var p = px(m), g = s('g', {});
      var abime = m.built && m.dmg > 0;
      if (!m.built) {
        g.appendChild(s('rect', {
          x: p.x, y: p.y, width: BW, height: BH, fill: 'none',
          stroke: st.chantier === m.id ? '#3b4e63' : '#1b2532',
          'stroke-width': 1, 'stroke-dasharray': '4 4'
        }));
      } else {
        g.appendChild(s('rect', {
          x: p.x, y: p.y, width: BW, height: BH,
          fill: abime ? (m.dmg > 1 ? '#221314' : '#1d1a15') : '#141d27',
          stroke: abime ? (m.dmg > 1 ? '#d9604a' : '#e4b44c') : '#2a3949',
          'stroke-width': abime ? 1.4 : 1
        }));
      }
      if (m.id === 'MACHINES' && m.built) {
        var pulse = s('circle', { cx: p.x + BW / 2, cy: p.y + BH - 16, r: 4.5, fill: '#54d0e2', opacity: '0.85' });
        var an = s('animate', { attributeName: 'opacity', values: '0.85;0.25;0.85', dur: '2.6s', repeatCount: 'indefinite' });
        pulse.appendChild(an); g.appendChild(pulse);
      }
      var nom = s('text', {
        x: p.x + 7, y: p.y + 15, fill: m.built ? (abime ? (m.dmg > 1 ? '#d9604a' : '#e4b44c') : '#cdd9e5') : '#4a5b6d',
        'font-size': '9.5', 'font-family': 'IBM Plex Mono, monospace', 'letter-spacing': '0.5'
      });
      nom.textContent = m.nom.toUpperCase();
      g.appendChild(nom);

      var sous = s('text', { x: p.x + 7, y: p.y + 28, fill: '#5d6e80', 'font-size': '8', 'font-family': 'IBM Plex Mono, monospace' });
      if (!m.built) {
        sous.textContent = st.chantier === m.id ? 'CHANTIER ' + st.chantierFait + '/' + chantierCout(m.id) : 'NON CONSTRUIT';
      } else if (abime) {
        sous.textContent = m.dmg > 1 ? 'HORS SERVICE' : 'À RÉPARER';
      } else if (poste !== 'equipage') {
        sous.textContent = (m.boucle ? 'BOUCLE ' + m.boucle : 'HORS BOUCLE') + (m.hab ? ' · ' + Math.round(m.ins * 100) + '%' : '');
      } else if (m.hab) {
        sous.textContent = m.cap + (m.cap > 1 ? ' LITS' : ' LIT');
      }
      g.appendChild(sous);

      // occupants : visibles au poste équipage, qui tient le registre humain
      if (m.built && (poste === 'equipage' || poste === 'demo')) {
        var gens = st.crew.filter(function (c) { return c.couchage === m.id && c.etat !== 'perdu'; });
        gens.forEach(function (c, i) {
          var col = c.etat === 'critique' ? '#d9604a' : (c.etat === 'malade' || c.etat === 'blesse') ? '#e4b44c' : '#e39a6c';
          g.appendChild(s('circle', { cx: p.x + 11 + i * 13, cy: p.y + BH - 12, r: 4, fill: col }));
          var ini = s('text', { x: p.x + 11 + i * 13, y: p.y + BH - 9.2, fill: '#0b1016', 'font-size': '5.6', 'font-family': 'IBM Plex Mono, monospace', 'text-anchor': 'middle', 'font-weight': '700' });
          ini.textContent = c.prenom[0];
          g.appendChild(ini);
        });
      }
      svg.appendChild(g);
    });
    return H('div', { class: 'schema' }, svg);
  }

  }

  function acheterCompetence(branch,id){
    if(!st||st.fini)return;
    if(save.p2pRole==='guest'){
      /* L'hôte détient la sauvegarde autoritaire : un achat hors ligne
         ferait diverger les deux téléphones. */
      if(!net.connected){ alert('Station hôte hors ligne : l’achat de compétence sera possible dès la reconnexion.'); return; }
      p2pSend({type:'skill_upgrade',branch:branch,id:id});
      return;
    }
    var r=B.buyTalent(st,branch,id);
    if(!r.ok)return;
    save.skillOps=Array.isArray(save.skillOps)?save.skillOps:[];
    save.skillOps.push({branch:branch,id:id});
    save.decisions.push('S:'+branch+':'+id);
    enregistrer();
    if(net.role==='host'&&net.connected)p2pSendSnapshot(true);
    /* On rafraîchit l'écran réellement affiché, sinon l'achat reste invisible. */
    if(ecranCourant==='progression')rendreProgression();else rendreHub();
  }

  function rendreDossier(){
    var box=vide($('ecran-dossier'));
    var pile=H('div',{class:'pile'});
    var damaged=Object.keys(st.modules).map(function(k){return st.modules[k];}).filter(function(m){return m.built&&m.dmg>0;});
    var actifs=B.actifs(st);
    var fragiles=actifs.filter(function(c){return c.sante<55||c.etat==='malade'||c.etat==='blesse'||c.etat==='critique';});
    var tendus=actifs.filter(function(c){return c.moral<40;});
    var dettes=Array.isArray(st.dette)?st.dette.length:0;
    var chantier=st.chantier?st.modules[st.chantier]:null;
    var stats;
    if(save.poste==='tech'){
      stats=[
        {lab:'Modules endommagés',v:String(damaged.length),cl:damaged.length?'alert':'good'},
        {lab:'Chantiers actifs',v:chantier?'1':'0',cl:chantier?'':'good'},
        {lab:'Équipage fragile',v:String(fragiles.length),cl:fragiles.length?'alert':''},
        {lab:'Dette diagnostic',v:String(dettes),cl:dettes?'alert':'good'}
      ];
    } else if(save.poste==='equipage') {
      stats=[
        {lab:'Personnes fragiles',v:String(fragiles.length),cl:fragiles.length?'alert':'good'},
        {lab:'Moral bas',v:String(tendus.length),cl:tendus.length?'alert':'good'},
        {lab:'Modules endommagés',v:String(damaged.length),cl:damaged.length?'alert':'good'},
        {lab:'Dette diagnostic',v:String(dettes),cl:dettes?'alert':'good'}
      ];
    } else {
      stats=[
        {lab:'Modules endommagés',v:String(damaged.length),cl:damaged.length?'alert':'good'},
        {lab:'Personnes fragiles',v:String(fragiles.length),cl:fragiles.length?'alert':'good'},
        {lab:'Entrées journal',v:String(st.journal.length),cl:''},
        {lab:'Dette diagnostic',v:String(dettes),cl:dettes?'alert':'good'}
      ];
    }
    var summary=H('div',{class:'dossier-summary'});

  function appliquer(payload, preResolved, crSauveArg, decSauveArg, avantArg) {
    var crSauve = crSauveArg || cr;
    var decSauve = decSauveArg ? decSauveArg.slice() : dec.slice();
    var avant = avantArg || { integrite: st.integrite, cohesion: st.cohesion };
    var stAvant = st;
    var resultat = B.resolve(stAvant, crSauve, decSauve);
    st = stAvant;
    st.derniere = resultat;
    save.decisions.push(payload);
    save.pendingLocal = null;
    enregistrer();
    recalculerApres(resultat, crSauve, avant);
    if (net.role === 'host' && net.connected) {
      p2pSend({
        type: 'resolved',
        seed: save.seed,
        decisions: save.decisions.slice(),
        result: resultat,
        cr: crSauve,
        avant: avant,
        stateCode: B.stateCode(save)
      });
    }
  }

  function recalculerApres(resultat, crSauve, avant) {
    round.key = null;
    round.localSubmitted = false;
    round.remoteSubmitted = false;
    round.localDec = null;
    round.remoteDec = null;
    save.pendingLocal = null;
    rendreResolution(resultat, crSauve, avant);
    aller('resolution');
    cr = B.crisisFor(st);
    dec = cr ? cr.defaut.slice() : null;
  }

        H('span', { class: 'etiquette', text: 'État P2P' }),
        H('div', { class: 'etat-code', 'data-p2p-status':'1', text: p2pStatusText() || 'hors ligne' }),
        save.p2pRole === 'host' ? H('div', { class: 'petit', style: 'margin-top:8px;word-break:break-all', text: 'ID hôte : ' + (save.hostPeerId || '—') }) : null
      ),
      actions,
      H('div', { class: 'caisson pile' },
        H('span', { class: 'etiquette', text: 'Sauvegarde locale' }),
        H('div', { class: 'petit', text: save.seed ? ('Station ' + save.seed + ' · ' + save.decisions.length + ' décision(s) enregistrée(s)') : 'Aucune station chargée.' }),
        save.seed ? H('div', { class: 'petit', style: 'font-family:var(--mono);word-break:break-all;color:var(--givre);margin-top:5px', text: 'État ' + B.stateCode(save) }) : null
      ),
      H('div', { class: 'note-regle', text: 'PeerJS sert à établir la connexion. Le contenu de la partie est ensuite envoyé directement d’un navigateur à l’autre.' }),
      H('button', { class: 'btn-large btn-discret', onclick: function () { rendreHub(); aller('hub'); } }, 'Retour')
    ));
    aller('sync');
  }

  /* ============================================================
     FIN D'HIVER
     ============================================================ */
  function rendreFin() {
    var box = vide($('ecran-fin'));
    var pile = H('div', { class: 'pile' });
    var perdus = st.crew.filter(function (c) { return c.etat === 'perdu'; });
    var titre = st.issue === 'printemps' ? 'Le printemps' : st.issue === 'station' ? 'La station a lâché' : 'Plus personne pour tenir';
    var texte = st.issue === 'printemps'
      ? 'Le soleil est repassé au-dessus de l\'horizon le ' + B.JOURS_HIVER + 'ᵉ jour. La station tient encore debout, et vous savez exactement à quel prix.'
      : st.issue === 'station'
        ? 'Trop de systèmes hors service, trop de réparations restées en suspens. Il a fallu abandonner Borée en plein hiver.'
        : 'Il ne reste plus assez de monde en état de faire tourner la station. L\'hivernage s\'arrête là.';

    pile.appendChild(H('div', {},
      H('span', { class: 'etiquette', text: 'Hiver ' + st.annee + ' · station ' + save.seed }),
      H('h1', { class: 'titre-geant', style: 'font-size:clamp(40px,14vw,72px)', text: titre }),
      H('p', { class: 'prose', text: texte })
    ));
    pile.appendChild(schema());
    pile.appendChild(H('div', { class: 'jauges' }, jauge('Intégrité', st.integrite), jauge('Cohésion', st.cohesion)));
    if (perdus.length) {
      pile.appendChild(H('div', { class: 'caisson pile' },
        H('span', { class: 'etiquette', text: 'Ne sont pas rentrés' }),
        H('div', {}, perdus.map(function (c) { return H('div', { class: 'prose', text: c.nom + ' — ' + c.role }); }))
      ));
    }
    var construits = Object.keys(st.modules).filter(function (k) { return st.modules[k].built && !['DORTOIR_A', 'DORTOIR_B', 'CARRE', 'LABO', 'MACHINES', 'RESERVE', 'SAS'].includes(k); });
    if (construits.length) {
      pile.appendChild(H('div', { class: 'caisson pile' },
        H('span', { class: 'etiquette', text: 'Construit pendant l\'hiver' }),
        H('div', {}, construits.map(function (k) { return H('div', { class: 'prose', text: st.modules[k].nom }); }))
      ));
    }
    pile.appendChild(H('button', { class: 'btn-large btn-discret', onclick: function () { rendreJournal(); aller('journal'); } }, 'Relire le journal'));
    if (st.issue === 'printemps') {
      pile.appendChild(H('div', { class: 'note-regle', text: 'Un second hivernage repart avec les survivants, une station déjà marquée, et un froid plus dur. Les deux téléphones doivent le lancer, sinon les histoires divergent.' }));
      pile.appendChild(H('button', {
        class: 'btn-large btn-primaire', onclick: function () {
          passerHiver();
        }
      }, 'Hiver ' + (st.annee + 1)));
    }
    pile.appendChild(H('button', {
      class: 'btn-large btn-discret', onclick: function () {
        if (!confirm('Abandonner cette station et revenir au menu ?')) return;
        rendreAccueil(); aller('accueil');
      }
    }, 'Menu'));
    box.appendChild(pile);
  }

  /*
   * STARTUP ORDER
   * -------------
   * 1. decorate / animate page
   * 2. load save
   * 3. if ?join=... create guest transport
   * 4. otherwise resume an existing role
   * 5. render exactly one current screen
   *
   * Do not add async rendering work before the initial save/role decision;
   * Safari can race navigation with storage and PeerJS callbacks.
   */
  /* ---------- démarrage ---------- */
  document.addEventListener('click',function(e){if(e.target&&e.target.hasAttribute&&e.target.hasAttribute('data-menu-close'))fermerMenu();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')fermerMenu();});
  /*
   * iOS coupe la socket de signalisation dès que l'écran se verrouille.
   * Au retour en avant-plan, on relance la liaison — une seule fois, sans
   * timer permanent.
   */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden)return;
    if(!save||!save.p2pRole||save.p2pRole==='demo')return;
    if(net.connected){p2pSetStatus();return;}
    if(!net.peer||net.peer.destroyed){p2pInit();p2pSetStatus();return;}
    try{ if(net.peer.disconnected) net.peer.reconnect(); }catch(e){}
    if(net.role==='guest')p2pScheduleGuestRetry(400);
    p2pSetStatus();
  });

  function demarrer() {
    neige();
    var loaded = charger();
    p2pSaveShape();

    var joinId = null;
    try { joinId = new URLSearchParams(location.search).get('join'); } catch (e) { joinId = null; }
    if (joinId) {
      save = { seed: null, decisions: [], poste: null, p2pRole: 'guest', hostPeerId: normaliserCodeStation(String(joinId)), peerId: null, pendingLocal: null, skillOps: [], storySeen: false };
      p2pSaveShape(); enregistrer();
      try { window.history.replaceState({}, '', location.pathname + location.hash); } catch (e) {}
      p2pInit();
      rendreAttenteConnexion();
      aller('poste');
      return;
    }

    if (loaded && save.seed) {
      try { recalculer(); } catch (e) { save = { seed: null, decisions: [], poste: null, p2pRole: null, hostPeerId: null, peerId: null, pendingLocal: null, skillOps: [], storySeen: true }; st = null; cr = null; dec = null; try { localStorage.removeItem(CLE); } catch (e2) {} }
    }
    if (save.p2pRole) p2pInit();
    if (loaded && save.p2pRole === 'guest' && !save.seed) {
      rendreAttenteConnexion();
      aller('poste');
      return;
    }
    rendreAccueil();
    aller('accueil');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else demarrer();
})();
</script>

<script id="boree-polish6-js">
(function(){
  'use strict';
  function syncAmbient(){
    var d=document.documentElement;
    var screen=d.getAttribute('data-screen')||'accueil';
    d.setAttribute('data-ambient',screen);
  }
  syncAmbient();
  try{
    var mo=new MutationObserver(function(m){
      for(var i=0;i<m.length;i++) if(m[i].attributeName==='data-screen'){syncAmbient();break;}
    });
    mo.observe(document.documentElement,{attributes:true,attributeFilter:['data-screen']});
  }catch(e){}
})();
</script>


<script id="boree-polish7-js">
(function(){
  'use strict';
  var KEY='boree.sound.v1';
  var enabled=true, ctx=null, lastScreen=null, pulseTimer=0;
  try{ var raw=localStorage.getItem(KEY); if(raw!==null) enabled=raw==='1'; }catch(e){}

  function audioCtor(){ return window.AudioContext || window.webkitAudioContext || null; }
  function ensure(){
    if(!enabled) return null;
    if(ctx) return ctx;
    var C=audioCtor(); if(!C) return null;
    try{ ctx=new C(); }catch(e){ return null; }
    return ctx;
  }
  function wake(){
    var c=ensure();
    if(c && c.state==='suspended'){ try{ c.resume(); }catch(e){} }
    return c;
  }
  function tone(freq,dur,vol,type,delay){
    var c=ensure(); if(!c) return;
    try{
      if(c.state==='suspended') c.resume();
      var now=c.currentTime+(delay||0);
      var o=c.createOscillator(), g=c.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(freq,now);
      g.gain.setValueAtTime(0.0001,now);
      g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),now+.008);
      g.gain.exponentialRampToValueAtTime(.0001,now+dur);
      o.connect(g); g.connect(c.destination); o.start(now); o.stop(now+dur+.02);
    }catch(e){}
  }
  function haptic(pattern){ try{ if(enabled && navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
  function click(kind){
    if(!enabled) return;
    if(kind==='primary'){ tone(1040,.055,.028,'triangle'); haptic(8); }
    else if(kind==='menu'){ tone(520,.07,.018,'sine'); }
    else if(kind==='choice'){ tone(760,.028,.017,'square'); }
    else if(kind==='danger'){ tone(210,.12,.025,'sawtooth'); haptic([10,22,10]); }
    else { tone(1450,.022,.012,'square'); }
  }
  function screenCue(screen){
    if(!enabled || screen===lastScreen) return;
    lastScreen=screen;
    if(screen==='crise'){ tone(880,.06,.016,'triangle'); tone(1320,.07,.012,'triangle',.07); }
    else if(screen==='transmission'){ tone(420,.08,.013,'sine'); tone(620,.055,.009,'sine',.09); }
    else if(screen==='resolution'){ tone(660,.07,.012,'sine'); tone(990,.11,.013,'triangle',.09); }
    else if(screen==='progression'){ tone(520,.05,.009,'sine'); }
  }
  function visualFeedback(kind){
    var body=document.body; if(!body) return;
    clearTimeout(pulseTimer);
    body.classList.remove('boree-feedback-pulse','boree-feedback-critical');
    void body.offsetWidth;
    body.classList.add(kind==='danger'?'boree-feedback-critical':'boree-feedback-pulse');
    pulseTimer=setTimeout(function(){body.classList.remove('boree-feedback-pulse','boree-feedback-critical');},460);
  }
  function setEnabled(v){
    enabled=!!v;
    try{localStorage.setItem(KEY,enabled?'1':'0');}catch(e){}
    if(enabled) wake();
    renderToggle();
  }
  function renderToggle(){
    var c=document.getElementById('menu-corps'); if(!c) return;
    var old=c.querySelector('[data-boree-audio-toggle]');
    if(old) old.remove();
    var b=document.createElement('button');
    b.className='boree-audio-toggle'; b.type='button'; b.setAttribute('data-boree-audio-toggle','1');
    var a=document.createElement('span'); a.textContent='Sons interface';
    var s=document.createElement('span'); s.textContent=enabled?'ACTIFS':'MUETS';
    b.appendChild(a); b.appendChild(s);
    b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();setEnabled(!enabled);click('choice');});
    c.appendChild(b);
  }
  document.addEventListener('pointerdown',function(){ wake(); },{passive:true});
  document.addEventListener('click',function(ev){
    var t=ev.target&&ev.target.closest?ev.target.closest('button,.resume-card,.menu-item,.segments button'):null;
    if(!t || t.disabled || t.hasAttribute('data-boree-audio-toggle')) return;
    var txt=(t.textContent||'').trim().toLowerCase();
    if(/valider|appliquer|continuer|créer|rejoindre|hiver/.test(txt)) click('primary');
    else if(/menu|journal|dossier|progression|synchronisation|règles/.test(txt)) click('menu');
    else if(t.matches('.segments button,.talent,.resume-card')) click('choice');
    else click('normal');
    if(/abandonner|erreur|refusé|critique/.test(txt)){ click('danger'); visualFeedback('danger'); }
  },{passive:true});
  try{
    var root=document.documentElement;
    lastScreen=root.getAttribute('data-screen');
    screenCue(lastScreen||'accueil');
    var mo=new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++) if(ms[i].attributeName==='data-screen'){ screenCue(root.getAttribute('data-screen')||'accueil'); break; }
    });
    mo.observe(root,{attributes:true,attributeFilter:['data-screen']});
  }catch(e){}
  try{
    var menu=document.getElementById('menu-jeu');
    if(menu){
      var mm=new MutationObserver(function(){ if(menu.classList.contains('open')) renderToggle(); });
      mm.observe(menu,{attributes:true,attributeFilter:['class']});
    }
  }catch(e){}
  window.BoreeAudio={enabled:function(){return enabled;},setEnabled:setEnabled};
})();
</script>
