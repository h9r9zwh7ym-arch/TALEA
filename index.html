/* ============================================================
   POLISH 11 — DOSSIER
   ============================================================ */
.dossier-head{position:relative}
.dossier-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 8px}

/* ============================================================
   BORÉE — FINAL POLISH
   Direction artistique finale : station scientifique polaire,

body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.15;background-image:linear-gradient(rgba(205,217,229,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(205,217,229,.035) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,black 0%,transparent 88%)}

<style>
/* ============================================================
   BORÉE — un seul monde visuel : un écran d'instrument dans une
   station polaire, la nuit. Volontairement mono-thème ; toutes les
   couleurs sont peintes explicitement pour tenir sur n'importe quel
   fond hôte.
   ============================================================ */
:root {
  color-scheme: dark;
  --sol: #070a0f;
  --sol-haut: #0b1016;
  --caisson: #0d1218;
  --caisson-clair: #131a23;
  --trait: #1b2532;
  --trait-vif: #2a3949;
  --givre: #cdd9e5;
  --givre-doux: #9fb0c1;
  --sourd: #67788a;
  --tech: #54d0e2;
  --equipage: #e39a6c;
  --alerte: #e4b44c;
  --grave: #d9604a;
  --bon: #79c78a;
  --accent: var(--tech);
  --accent-faible: rgba(84, 208, 226, 0.13);
  --r: 3px;
  --pas: 14px;
  --large: 560px;
  --display: "Saira Condensed", "Oswald", "Arial Narrow", sans-serif;
  --corps: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

[data-poste="equipage"] {
  --accent: var(--equipage);
  --accent-faible: rgba(227, 154, 108, 0.13);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--sol);
  color: var(--givre);
  font-family: var(--corps);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#neige {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
}

#app {
  position: relative;
  z-index: 1;
  max-width: var(--large);
  margin: 0 auto;
  padding-inline: 18px;
  padding-block: 0 64px;
}

/* ---------- barre haute ---------- */
#barre {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding-block: 12px 10px;
  margin-bottom: 16px;
  background: linear-gradient(to bottom, var(--sol) 68%, rgba(7, 10, 15, 0));
  border-bottom: 1px solid var(--trait);
}

#barre .nom {
  font-family: var(--display);
  font-size: 25px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--givre);
  line-height: 1;
}

#barre .jour {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--sourd);
  letter-spacing: 0.05em;
  margin-left: auto;
  text-align: right;
}

#barre .poste {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 3px 7px;
  white-space: nowrap;
}

/* ---------- blocs ---------- */
.ecran { display: none; }
.ecran.actif { display: block; }

.pile { display: flex; flex-direction: column; gap: var(--pas); }
.rang { display: flex; flex-wrap: wrap; gap: 8px; }

h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 600; }

.titre-geant {
  font-family: var(--display);
  font-size: clamp(56px, 21vw, 104px);
  letter-spacing: 0.07em;
  line-height: 0.9;
  text-transform: uppercase;
  color: var(--givre);
  margin-bottom: 4px;
}

.sous-titre {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--tech);
  margin-bottom: 22px;
}

.etiquette {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--sourd);
  display: block;
  margin-bottom: 7px;
}

.titre-bloc {
  font-family: var(--display);
  font-size: 21px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--givre);
}

.prose { color: var(--givre-doux); max-width: 62ch; }
.prose strong { color: var(--givre); font-weight: 600; }
.petit { font-size: 13px; color: var(--sourd); }

/* Le poste technique lit des relevés : encadrés carrés, filets, chiffres
   alignés. Le poste équipage lit des gens : coins adoucis, filet chaud. */
.caisson {
  background: var(--caisson);
  border: 1px solid var(--trait);
  padding: 15px;
}

[data-poste="equipage"] .caisson { border-radius: var(--r); }

.caisson.accentue {
  border-left: 2px solid var(--accent);
  background: linear-gradient(90deg, var(--accent-faible), transparent 42%), var(--caisson);
}

/* ---------- boutons ---------- */
button {
  font-family: var(--corps);
  font-size: 14px;
  color: var(--givre);
  background: var(--caisson-clair);
  border: 1px solid var(--trait-vif);
  padding: 11px 15px;
  cursor: pointer;
  transition: border-color 0.14s, background 0.14s, color 0.14s;
  text-align: left;
}

button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn-large {
  display: block;
  width: 100%;
  font-family: var(--display);
  font-size: 19px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 14px 16px;
  text-align: center;
}

.btn-primaire {
  background: var(--accent);
  border-color: var(--accent);
  color: #06090d;
  font-weight: 600;
}

.btn-primaire:hover { filter: brightness(1.12); }
.btn-discret { background: transparent; border-color: var(--trait); color: var(--givre-doux); }
.btn-discret:hover { color: var(--givre); }

input[type="text"] {
  font-family: var(--mono);
  font-size: 18px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  background: var(--sol-haut);
  color: var(--givre);
  border: 1px solid var(--trait-vif);
  padding: 11px 13px;
  width: 100%;
}

input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
input[type="text"]::placeholder { color: var(--sourd); letter-spacing: 0.2em; }

/* ---------- schéma de la station ---------- */
.schema {
  background: radial-gradient(120% 90% at 50% 0%, #101822, var(--sol-haut) 70%);
  border: 1px solid var(--trait);
  padding: 6px;
}

.schema svg { display: block; width: 100%; height: auto; max-width: 100%; }

/* ---------- jauges ---------- */
.jauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.jauge { background: var(--caisson); border: 1px solid var(--trait); padding: 11px 12px; }

.jauge .val {
  font-family: var(--mono);
  font-size: 26px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  color: var(--givre);
}

.jauge .barre { height: 3px; background: var(--trait-vif); margin-top: 9px; }
.jauge .barre i { display: block; height: 100%; background: var(--accent); }
.jauge.bas .val, .jauge.bas .barre i { color: var(--grave); background-color: var(--grave); }
.jauge.bas .val { background: none; }
.jauge.moyen .val { color: var(--alerte); }
.jauge.moyen .barre i { background: var(--alerte); }

/* ---------- listes de données (poste technique) ---------- */
table.releve {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}

table.releve th {
  text-align: right;
  font-weight: 400;
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--sourd);
  border-bottom: 1px solid var(--trait-vif);
  padding: 0 0 6px 8px;
  white-space: nowrap;
}

table.releve th:first-child, table.releve td:first-child { text-align: left; padding-left: 0; }
table.releve td { padding: 7px 0 7px 8px; text-align: right; border-bottom: 1px solid var(--trait); color: var(--givre-doux); white-space: nowrap; }
table.releve td:first-child { color: var(--givre); }
table.releve tr:last-child td { border-bottom: none; }
td .hs { color: var(--grave); font-weight: 600; }
td .att { color: var(--alerte); }
.defile { overflow-x: auto; }

/* ---------- fiches d'équipage (poste équipage) ---------- */
.fiche {
  background: var(--caisson);
  border: 1px solid var(--trait);
  border-left: 2px solid var(--equipage);
  border-radius: var(--r);
  padding: 12px 13px;
}

.fiche.malade { border-left-color: var(--grave); }
.fiche.attention { border-left-color: var(--alerte); }
.fiche .nom { font-weight: 600; color: var(--givre); }
.fiche .role { font-size: 12px; color: var(--sourd); }
.fiche .dit { color: var(--givre-doux); font-size: 14px; margin-top: 7px; }
.fiche .dit em { color: var(--equipage); font-style: italic; }
.fiche .meta { font-family: var(--mono); font-size: 10.5px; color: var(--sourd); margin-top: 8px; letter-spacing: 0.03em; }

/* ---------- contrôles de décision ---------- */
.ligne-dec { border-bottom: 1px solid var(--trait); padding-block: 12px; }
.ligne-dec:last-child { border-bottom: none; }
.ligne-dec .quoi { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 9px; }
.ligne-dec .quoi b { font-weight: 600; }
.ligne-dec .quoi span { font-family: var(--mono); font-size: 11px; color: var(--sourd); text-align: right; white-space: nowrap; }

/* Tableau des régimes : un bloc par module plutôt qu'une grande table,
   parce que l'écran fait 390 px de large et que la colonne « Plein »
   est justement celle qu'on veut voir. */
.mod-bloc { border-bottom: 1px solid var(--trait); padding-block: 11px; }
.mod-bloc:last-of-type { border-bottom: none; }
.mod-tete { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.mod-tete b { font-weight: 600; color: var(--givre); }
.mod-tete span { font-family: var(--mono); font-size: 10.5px; color: var(--sourd); white-space: nowrap; }
.regimes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.regimes > div { background: var(--sol-haut); border: 1px solid var(--trait); padding: 6px 3px; text-align: center; }
.regimes .lab { display: block; font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sourd); }
.regimes .tp { display: block; font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; color: var(--givre); margin-top: 3px; }
.regimes .kw { display: block; font-family: var(--mono); font-size: 9.5px; color: var(--sourd); }
.regimes .danger { border-color: rgba(217, 96, 74, 0.45); }
.regimes .danger .tp { color: var(--grave); }
.regimes .limite .tp { color: var(--alerte); }

.segments { display: grid; gap: 5px; grid-template-columns: repeat(4, 1fr); }

.segments button {
  min-width: 0;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  padding: 8px 5px;
  text-align: center;
  background: transparent;
  border-color: var(--trait);
  color: var(--givre-doux);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.segments button[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #06090d;
  font-weight: 600;
}

.choix { display: flex; flex-direction: column; gap: 7px; }

.choix button {
  display: block;
  width: 100%;
  border-color: var(--trait);
  background: transparent;
  padding: 10px 12px;
}

.choix button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-faible); }
.choix button b { display: block; font-weight: 600; color: var(--givre); }
.choix button i { display: block; font-style: normal; font-size: 12.5px; color: var(--sourd); margin-top: 2px; }

/* ---------- code de transmission ---------- */
.code-affiche {
  font-family: var(--mono);
  font-size: clamp(38px, 13vw, 58px);
  letter-spacing: 0.16em;
  text-align: center;
  color: var(--accent);
  background: var(--sol-haut);
  border: 1px dashed var(--trait-vif);
  padding: 18px 10px;
  word-break: break-all;
}

.etat-code {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.22em;
  color: var(--givre);
}

/* ---------- rapports de résolution ---------- */
.rapport { display: flex; flex-direction: column; gap: 9px; }

.item {
  display: grid;
  grid-template-columns: 16px 1fr;
  gap: 9px;
  align-items: start;
  font-size: 14px;
  color: var(--givre-doux);
}

.item::before {
  content: "—";
  font-family: var(--mono);
  font-size: 12px;
  color: var(--sourd);
  line-height: 1.6;
}

.item.good { color: var(--givre); }
.item.good::before { content: "✓"; color: var(--bon); }
.item.warn::before { content: "!"; color: var(--alerte); }
.item.bad::before { content: "×"; color: var(--grave); }
.item.bad { color: #f0d7d2; }

.recit {
  font-size: 15.5px;
  line-height: 1.62;
  color: var(--givre);
  border-left: 2px solid var(--trait-vif);
  padding-left: 14px;
}

.recit p { margin: 0 0 9px; }
.recit p:last-child { margin-bottom: 0; }

/* ---------- journal ---------- */
.entree { border-bottom: 1px solid var(--trait); padding-block: 13px; }
.entree:last-child { border-bottom: none; }
.entree .quand { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sourd); }
.entree h3 { font-family: var(--display); font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; margin-top: 3px; }
.entree p { margin: 5px 0 0; color: var(--givre-doux); font-size: 14px; }

/* ---------- divers ---------- */
.note-regle {
  font-size: 13px;
  color: var(--sourd);
  border-left: 2px solid var(--trait-vif);
  padding-left: 12px;
}

.avert { color: var(--alerte); font-size: 13px; font-family: var(--mono); }
.erreur { color: var(--grave); font-size: 13px; }
.puces { margin: 0; padding-left: 18px; color: var(--givre-doux); }
.puces li { margin-bottom: 5px; }
.sep { height: 1px; background: var(--trait); }


/* ---------- architecture UX ---------- */
#app{padding-bottom:92px}
#barre{min-height:48px}
#barre .nom{cursor:pointer}
.barre-action{margin-left:4px;border:1px solid var(--trait);background:transparent;color:var(--givre-doux);width:32px;height:30px;border-radius:3px;font-size:18px;cursor:pointer}
.barre-action:hover,.barre-action:focus-visible{border-color:var(--accent);color:var(--givre);outline:none}
.nav-jeu{display:none;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(calc(100% - 20px),560px);z-index:30;background:rgba(9,13,18,.96);border:1px solid var(--trait-vif);box-shadow:0 12px 35px rgba(0,0,0,.38);backdrop-filter:blur(12px);padding:6px;grid-template-columns:repeat(4,1fr);gap:5px}
.nav-jeu.visible{display:grid}
.nav-jeu button{appearance:none;border:0;background:transparent;color:var(--sourd);min-height:50px;padding:5px 3px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
.nav-jeu button strong{font-family:var(--corps);font-size:12px;letter-spacing:0;color:var(--givre-doux);font-weight:600}
.nav-jeu button.active{background:var(--accent-faible);color:var(--accent)}
.nav-jeu button.active strong{color:var(--givre)}
.nav-badge{font-size:9px;color:var(--accent);margin-left:2px}
.menu-jeu{position:fixed;inset:0;z-index:50;pointer-events:none}
.menu-jeu.open{pointer-events:auto}
.menu-voile{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;transition:opacity .18s}
.menu-jeu.open .menu-voile{opacity:1}
.menu-panneau{position:absolute;right:0;top:0;bottom:0;width:min(88vw,390px);background:var(--caisson);border-left:1px solid var(--trait-vif);padding:20px 18px 28px;transform:translateX(105%);transition:transform .22s ease;overflow:auto;box-shadow:-18px 0 50px rgba(0,0,0,.35)}
.menu-jeu.open .menu-panneau{transform:translateX(0)}
.menu-tete{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--trait);margin-bottom:12px}
.menu-tete strong{font-family:var(--display);font-size:26px;text-transform:uppercase;letter-spacing:.05em}
.menu-fermer{border:1px solid var(--trait);background:transparent;color:var(--givre);width:38px;height:38px;font-size:24px;cursor:pointer}
.menu-section{padding:10px 0 4px;color:var(--sourd);font:10px var(--mono);text-transform:uppercase;letter-spacing:.14em}
.menu-item{width:100%;border:1px solid var(--trait);background:var(--sol-haut);color:var(--givre);padding:13px 12px;margin:5px 0;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.menu-item:hover,.menu-item:focus-visible{border-color:var(--accent);outline:none}
.menu-item small{color:var(--sourd);font:10px var(--mono)}
.ux-breadcrumb{display:flex;align-items:center;gap:7px;margin-bottom:10px;color:var(--sourd);font:10px var(--mono);text-transform:uppercase;letter-spacing:.1em}
.ux-breadcrumb button{border:0;background:none;color:var(--accent);font:inherit;padding:0;cursor:pointer}
.hub-hero{border:1px solid var(--trait-vif);background:linear-gradient(135deg,var(--caisson-clair),var(--caisson));padding:16px}
.hub-hero .titre-bloc{font-size:25px}
.hub-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.hub-meta>div{border-top:1px solid var(--trait);padding-top:8px}
.hub-meta b{display:block;font:14px var(--mono);color:var(--givre)}
.hub-meta span{display:block;font:9px var(--mono);text-transform:uppercase;color:var(--sourd);letter-spacing:.08em}
.action-principale{border:1px solid var(--accent);background:var(--accent-faible);padding:15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.action-principale .btn-large{margin:0;white-space:nowrap}
.section-titre{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--trait);padding-bottom:7px;margin-top:8px}
.section-titre .etiquette{margin:0}
.section-titre button{border:0;background:none;color:var(--accent);font:10px var(--mono);text-transform:uppercase;cursor:pointer}
.resume-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.resume-card{background:var(--caisson);border:1px solid var(--trait);padding:12px;min-height:74px}
.resume-card b{display:block;font-family:var(--display);font-size:19px;text-transform:uppercase}
.resume-card span{display:block;color:var(--sourd);font-size:11px;margin-top:2px}
.dossier-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px}
.dossier-tabs button{border:1px solid var(--trait);background:var(--caisson);color:var(--givre-doux);padding:10px;font:10px var(--mono);text-transform:uppercase;cursor:pointer}
.dossier-tabs button.active{border-color:var(--accent);color:var(--givre);background:var(--accent-faible)}
@media(max-width:380px){.nav-jeu{bottom:7px}.nav-jeu button{min-height:46px}.hub-meta{grid-template-columns:1fr 1fr}.hub-meta>div:last-child{grid-column:1/-1}.resume-grid{grid-template-columns:1fr}}

@media (max-width: 380px) {
  .jauges { grid-template-columns: 1fr; }
  #barre .nom { font-size: 21px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  #neige { display: none; }
}
\n/* ============================================================\n   INTRODUCTION — arrivée scientifique à Borée\n   ============================================================ */\n.intro-shell{min-height:calc(100vh - 76px);display:flex;align-items:center;justify-content:center;padding:18px 0 54px}\n.intro{width:100%;max-width:560px;position:relative;overflow:hidden;border:1px solid var(--trait);background:#080d13;min-height:620px;box-shadow:0 18px 70px rgba(0,0,0,.35)}\n.intro-scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .7s ease;display:flex;flex-direction:column;justify-content:flex-end}\n.intro-scene.active{opacity:1;pointer-events:auto}\n.intro-visual{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#07101a,#0a1119 55%,#05080d)}\n.intro-visual:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,transparent 0 25%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.68) 100%)}\n.intro-stars{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(220,235,245,.65) 0 1px,transparent 1.5px);background-size:83px 71px;opacity:.3;animation:introDrift 24s linear infinite}\n.intro-horizon{position:absolute;left:-10%;right:-10%;bottom:27%;height:26%;background:linear-gradient(145deg,transparent 0 29%,#d6e0e8 30% 33%,#91a3b3 34% 36%,transparent 37%),linear-gradient(12deg,#111b25 0 45%,transparent 46%);filter:drop-shadow(0 0 12px rgba(190,220,235,.12))}\n.intro-station{position:absolute;left:50%;bottom:23%;width:230px;height:120px;transform:translateX(-50%);background:#121b24;border:2px solid #526474;box-shadow:0 0 0 5px rgba(4,8,12,.7),0 0 30px rgba(117,190,218,.13);clip-path:polygon(9% 18%,78% 18%,92% 37%,92% 100%,0 100%,0 37%)}\n.intro-station:before{content:"";position:absolute;left:16%;right:12%;top:22%;height:17px;background:repeating-linear-gradient(90deg,#243341 0 18px,#5f7d8e 19px 23px,#18242f 24px 39px);box-shadow:0 29px 0 #0b1219}\n.intro-light{position:absolute;width:7px;height:7px;border-radius:50%;background:#9ee7f0;box-shadow:0 0 14px #9ee7f0;animation:introBlink 2.8s ease-in-out infinite}\n.intro-light.l1{left:20%;bottom:36%}.intro-light.l2{left:49%;bottom:31%;animation-delay:1.1s}.intro-light.l3{left:73%;bottom:39%;animation-delay:1.8s}\n.intro-antenna{position:absolute;left:76%;bottom:43%;width:2px;height:100px;background:#718494;transform:rotate(8deg);transform-origin:bottom}.intro-antenna:after{content:"";position:absolute;top:-4px;left:-8px;width:18px;height:18px;border:1px solid #718494;border-radius:50%}\n.intro-snow{position:absolute;inset:-20%;background-image:radial-gradient(circle,rgba(235,246,252,.75) 0 1px,transparent 1.7px);background-size:37px 49px;opacity:0;animation:introSnow 5s linear infinite}\n.intro-snow.heavy{opacity:.55;animation-duration:3.2s}\n.intro-panel{position:relative;z-index:3;margin:0;padding:32px 24px 22px;background:linear-gradient(transparent,rgba(3,7,11,.96) 22%);min-height:245px;display:flex;flex-direction:column;justify-content:flex-end}\n.intro-kicker{font:10px var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--accent);margin-bottom:7px}\n.intro-title{font:clamp(30px,8vw,46px) var(--display);text-transform:uppercase;letter-spacing:.025em;line-height:.95;margin:0 0 11px;color:#eef6fb}\n.intro-text{font-size:15px;line-height:1.65;color:var(--givre-doux);margin:0;max-width:49ch}\n.intro-text strong{color:var(--givre)}\n.intro-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}\n.intro-chip{border:1px solid var(--trait-vif);background:rgba(13,18,24,.78);padding:7px 9px;font:9px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--givre-doux)}\n.intro-actions{position:relative;z-index:4;display:flex;gap:8px;padding:0 24px 24px;background:rgba(3,7,11,.96)}\n.intro-actions .btn-large{margin:0;flex:1}\n.intro-progress{position:absolute;z-index:5;top:14px;left:24px;right:24px;display:flex;gap:5px}\n.intro-dot{height:2px;flex:1;background:rgba(205,217,229,.18);transition:background .3s}\n.intro-dot.active{background:var(--accent)}\n.intro-credit{position:absolute;top:25px;right:24px;z-index:5;font:9px var(--mono);color:rgba(205,217,229,.45);text-transform:uppercase}\n@keyframes introDrift{from{transform:translateX(0)}to{transform:translateX(-83px)}}\n@keyframes introBlink{0%,100%{opacity:.35}50%{opacity:1}}\n@keyframes introSnow{from{transform:translate(0,-4%)}to{transform:translate(-8%,9%)}}\n@media(max-width:380px){.intro{min-height:580px}.intro-panel{padding:27px 18px 18px;min-height:235px}.intro-actions{padding:0 18px 18px}.intro-progress{left:18px;right:18px}.intro-credit{right:18px}.intro-station{width:190px}}\n@media(prefers-reduced-motion:reduce){.intro-stars,.intro-snow,.intro-light{animation:none}.intro-scene{transition:none}}\n

/* ============================================================
   POLISH 01 — instrument premium / tactile / mobile
   Couche visuelle uniquement : aucun changement de logique.

    var theIdx = rng.int(crew.length);

    for (var a = 0; a < crew.length; a++) {
      for (var b = a + 1; b < crew.length; b++) {

    crew.forEach(function(c){
      var others = crew.filter(function(x){ return x.id !== c.id; }).sort(function(a,b){
        return (rel[c.id + '|' + b.id] || rel[b.id + '|' + c.id] || 0) - (rel[c.id + '|' + a.id] || rel[a.id + '|' + c.id] || 0);
      });
      if (others.length) {
        var rv = rel[c.id + '|' + others[0].id];
        if (rv == null) rv = rel[others[0].id + '|' + c.id];

  /* ============================================================

  function tempAt(mod, level, dehors) {

  var COUT_NIVEAU = [0, 1.5, 3, 5];

  function genThermique(st, rng) {

    var mods = rng.shuffle(habitables(st)).sort(function (a, b) { return b.cap - a.cap; }).slice(0, 4);
    var eq = actifs(st);
    var capTot = mods.reduce(function (s, m) { return s + m.cap; }, 0);
    // puissance serrée : de quoi chauffer correctement deux ou trois modules,
    // jamais tous. Purger un module est un choix légitime, pas une faute.
    var plein = mods.reduce(function (s, m) { return s + COUT_NIVEAU[3] * (m.cap >= 2 ? 1 : 0.8); }, 0);
    var budget = Math.round((plein * (0.56 + rng.f() * 0.14) + (talentHas(st,'tech','thermo1') ? 0.5 : 0)) * 2) / 2;

    var cout = {}, temps = {};
    mods.forEach(function (m) {
      var fac = m.cap >= 2 ? 1 : 0.8;
      cout[m.id] = COUT_NIVEAU.map(function (c) { return Math.round(c * fac * 2) / 2; });
      temps[m.id] = [0, 1, 2, 3].map(function (l) { return tempAt(m, l, dehors); });
    });

      else if (c.trait.id === 'poussiere') { mini = 7; pourquoi = 'tousse dès qu\'il fait humide et froid'; }
      var seul = c.trait.id === 'insomnie';
      var cache = c.trait.id === 'orgueil' && mini > 4;
      return { id: c.id, mini: mini, pourquoi: pourquoi, seul: seul, cache: cache };
    });

    };

          t: dommage >= 16 ? 'bad' : 'warn',
          txt: c.prenom + ' a passé la nuit à ' + t + ' °C dans ' + m.nom + '. ' +
            (b.pourquoi ? (b.pourquoi === 'fiévreux, ne doit pas prendre froid' ? (genre(c) === 'il' ? 'Il est fiévreux et ne doit pas prendre froid. ' : 'Elle est fiévreuse et ne doit pas prendre froid. ') : (genre(c) === 'il' ? 'Il ' : 'Elle ') + b.pourquoi + '. ') : '') +
            (dommage >= 16 ? (genre(c) === 'il' ? 'Au matin, il ne tenait plus debout.' : 'Au matin, elle ne tenait plus debout.') : (genre(c) === 'il' ? 'Il s\'est réveillé en grelottant.' : 'Elle s\'est réveillée en grelottant.'))
        });
      } else {
        crewR.push({ t: 'ok', txt: c.prenom + ' — nuit correcte dans ' + m.nom + '.' });
        applyMoral(st, c.id, 2);
      }
      if (b.seul && occ[place[i]].length > 1) {
        applyMoral(st, c.id, -7);
        crewR.push({ t: 'warn', txt: c.prenom + ' n\'a pas fermé l\'œil : ' + m.nom + ' était partagé.' });
      }

      // Un lien solide devient un choix de vie concrète : dormir près d'un
      // proche fragile rassure, mais le séparer a un petit coût moral.
      var procheT = real && real.procheId ? st.crew.find(function (x) { return x.id === real.procheId; }) : null;
      if (procheT && procheT.etat !== 'perdu' && relOf(st, real.id, procheT.id) >= 2) {
        var procheFragileT = procheT.sante < 55 || procheT.etat === 'malade' || procheT.etat === 'blesse' || procheT.etat === 'critique';
        if (procheFragileT) {
          var procheIndexT = cr.eq.findIndex(function (x) { return x.id === procheT.id; });
          var ensembleT = procheIndexT >= 0 && place[procheIndexT] === place[i];
          if (ensembleT) {
            applyMoral(st, c.id, +2);
            applyMoral(st, procheT.id, +1);
            crewR.push({ t: 'ok', txt: c.prenom + ' garde ' + procheT.prenom + ' près d' + (genre(c) === 'il' ? 'e lui' : 'elle') + '. Leur présence mutuelle apaise la nuit.' });
          } else {
            applyMoral(st, c.id, -2);
            crewR.push({ t: 'warn', txt: c.prenom + ' reste préoccupé par ' + procheT.prenom + ', logé dans un autre module.' });
          }
        }
      }
    });

    // conflits
    cr.conflits.forEach(function (pair) {
      var ia = cr.eq.findIndex(function (c) { return c.id === pair[0]; });
      var ib = cr.eq.findIndex(function (c) { return c.id === pair[1]; });
      if (ia < 0 || ib < 0) return;
      if (place[ia] === place[ib]) {
        bumpRel(st, pair[0], pair[1], -1);
        applyMoral(st, pair[0], -9); applyMoral(st, pair[1], -9);
        dCohesion -= (talentHas(st,'coop','coord2') ? 6 : 9);
        crewR.push({ t: 'bad', txt: nomOf(st, pair[0]) + ' et ' + nomOf(st, pair[1]) + ' ont été mis dans le même module. Ça a fini en cris dans le couloir.' });
      } else {
        bumpRel(st, pair[0], pair[1], 1);
        dCohesion += 3;
      }
    });

    // mise à jour des couchages pour la suite de l'hiver
    cr.eq.forEach(function (c, i) {
      var real = st.crew.find(function (x) { return x.id === c.id; });
      if (real) real.couchage = cr.mods[place[i]].id;
    });

    var propre = dIntegrite === 0 && crewR.every(function (r) { return r.t === 'ok'; });
    if (propre) { dCohesion += 3; shared.push('Nuit sans incident. C\'est rare, et tout le monde l\'a remarqué.'); }

    return {
      tech: tech, crew: crewR, shared: shared,
      dIntegrite: dIntegrite, dCohesion: dCohesion,
      journal: {
        titre: 'Nuit à ' + cr.dehors + ' °C',
        txt: propre
          ? 'Chauffage réparti sans casse et sans personne dans le froid.'
          : 'Répartition du chauffage : ' + (dIntegrite <= -9 ? 'une conduite perdue. ' : '') + (crewR.some(function (r) { return r.t === 'bad'; }) ? 'Quelqu\'un a payé la nuit.' : 'ça a tenu, de justesse.')
      }
    };
  }

  /* ============================================================
     CRISE 2 — DIAGNOSTIC CROISÉ
     Lui : capteurs, boucles de ventilation, historique d'entretien.
     Elle : symptômes, horaires, habitudes. Ni l'un ni l'autre seul.
     ============================================================ */
  var CAUSES = [
    { id: 'FILTRE', nom: 'Filtre à air saturé', fix: 'REMPLACER' },
    { id: 'FUITE', nom: 'Fuite d\'échappement du groupe', fix: 'ETANCHER' },
    { id: 'SCRUBBER', nom: 'Épurateur de CO₂ en panne', fix: 'REPARER' },
    { id: 'EAU', nom: 'Réservoir d\'eau contaminé', fix: 'PURGER' },
    { id: 'MOISISSURE', nom: 'Moisissure dans un module', fix: 'ASSECHER' }
  ];
  var FIXES = [
    { id: 'REMPLACER', nom: 'Remplacer le filtre du module' },
    { id: 'ETANCHER', nom: 'Étancher le conduit d\'échappement' },
    { id: 'REPARER', nom: 'Démonter et réparer l\'épurateur' },
    { id: 'PURGER', nom: 'Purger et rebasculer le réservoir' },
    { id: 'ASSECHER', nom: 'Assécher et traiter le module' },
    { id: 'PALLIATIF', nom: 'Ventilation manuelle + module évacué (parer sans savoir)' }
  ];

  function genDiagnostic(st, rng, forcee) {
    var eq = actifs(st);
    var habs = habitables(st);
    var byMod = {};
    eq.forEach(function (c) {
      var m = habs.some(function (h) { return h.id === c.couchage; }) ? c.couchage : habs[0].id;
      (byMod[m] = byMod[m] || []).push(c);
    });
    var occupied = Object.keys(byMod);

    // choix de la cause parmi celles que l'état rend possibles
    var pool = [];
    occupied.forEach(function (m) { pool.push('FILTRE', 'MOISISSURE'); });
    if (byMod['DORTOIR_B'] && byMod['DORTOIR_B'].some(function (c) { return c.rythme === 'jour'; })) pool.push('FUITE', 'FUITE');
    var boucles = {};
    occupied.forEach(function (m) { var b = st.modules[m].boucle; (boucles[b] = boucles[b] || []).push(m); });
    var multi = Object.keys(boucles).filter(function (b) { return boucles[b].length >= 2; });
    if (multi.length) pool.push('SCRUBBER', 'SCRUBBER');
    if (eq.length >= 3) pool.push('EAU','EAU');
    // une cause laissée sans réponse revient : on régénère tous les indices
    // autour d'elle, sinon le relevé ne collerait plus aux symptômes.
    var causeId = (forcee && pool.indexOf(forcee) >= 0) ? forcee : rng.pick(pool);
    if (!forcee && st.eventPressures && st.eventPressures.eau > 0 && pool.indexOf('EAU') >= 0 && rng.chance(0.72)) causeId = 'EAU';
    var cause = CAUSES.find(function (c) { return c.id === causeId; });

    var cible = null, boucle = null, atteints = [], exempt = null, exemptRaison = null;
    if (causeId === 'FILTRE') {
      cible = rng.pick(occupied);
      atteints = byMod[cible].slice();
    } else if (causeId === 'MOISISSURE') {
      cible = rng.pick(occupied);
      atteints = byMod[cible].slice();
    } else if (causeId === 'FUITE') {
      cible = 'DORTOIR_B';
      atteints = byMod[cible].filter(function (c) { return c.rythme === 'jour'; });
      var nuiteux = byMod[cible].filter(function (c) { return c.rythme === 'nuit'; })[0];
      if (nuiteux) { exempt = nuiteux; exemptRaison = 'travaille de nuit : il n\'est jamais dans le module quand le groupe tourne à pleine charge'; }
    } else if (causeId === 'SCRUBBER') {
      boucle = Number(rng.pick(multi));
      var modsB = boucles[boucle];
      modsB.forEach(function (m) { atteints = atteints.concat(byMod[m]); });
      cible = modsB.join(' + ');
    } else if (causeId === 'EAU') {
      var the = eq.filter(function (c) { return c.boisson === 'thé'; })[0];
      atteints = eq.filter(function (c) { return c.boisson !== 'thé'; });
      if (the) { exempt = the; exemptRaison = 'ne boit que du thé, toujours bouilli'; }
    }
    if (!atteints.length) { atteints = [eq[0]]; }

    // symptômes par famille de cause
    var SYMPT = {
      FILTRE: ['maux de tête au réveil', 'fatigue lourde qui ne passe pas', 'difficulté à se concentrer'],
      FUITE: ['maux de tête violents au réveil', 'nausées', 'vertiges qui passent dès qu\'on sort'],
      SCRUBBER: ['essoufflement au moindre effort', 'maux de tête diffus', 'somnolence en journée'],
      EAU: ['crampes abdominales', 'nausées et diarrhée', 'pas de fièvre'],
      MOISISSURE: ['toux sèche persistante', 'gorge irritée', 'yeux qui piquent le matin']
    };
    var symptomes = atteints.map(function (c, i) {
      var s = rng.shuffle(SYMPT[causeId]).slice(0, 2);
      return { id: c.id, nom: c.prenom, sympt: s, couchage: c.couchage, rythme: c.rythme, boisson: c.boisson };
    });

    // leurre : quelqu'un de non atteint se plaint d'autre chose
    var sains = eq.filter(function (c) { return !atteints.some(function (a) { return a.id === c.id; }) && (!exempt || c.id !== exempt.id); });
    var leurre = null;
    if (sains.length) {
      var l = rng.pick(sains);
      leurre = {
        nom: l.prenom, couchage: l.couchage,
        sympt: rng.pick([
          'poignet enflé — s\'est tordu la main en déchargeant la chenillette avant-hier',
          'migraine, mais elle en a chaque hiver depuis dix ans, toujours à la même période',
          'dos bloqué depuis qu\'il a déplacé les bidons de la réserve',
          'ampoules et gerçures aux mains, rien d\'autre'
        ])
      };
    }

    // relevés techniques : signature de la cause + un faux positif
    // Seuil d'alerte affiché au poste technique : 1000 ppm de CO₂ la nuit.
    // Le bruit de fond reste sous 760, les deux causes qui chargent l'air
    // passent largement au-dessus : c'est le NOMBRE de modules touchés,
    // pas la valeur, qui sépare un filtre d'un épurateur.
    var releves = habs.map(function (m) {
      var co2j = rng.range(480, 640), co2n = co2j + rng.range(40, 110);
      var hum = rng.range(38, 54), co = 0;
      var age = rng.range(6, 26), duree = 30;
      if (causeId === 'FILTRE' && m.id === cible) { co2j += rng.range(300, 420); co2n += rng.range(620, 820); age = rng.range(37, 58); }
      if (causeId === 'MOISISSURE' && m.id === cible) { hum = rng.range(74, 86); }
      if (causeId === 'FUITE' && m.id === cible) { co = rng.range(28, 52); co2n += rng.range(60, 140); }
      if (causeId === 'SCRUBBER' && m.boucle === boucle) { co2j += rng.range(280, 380); co2n += rng.range(560, 760); }
      return { id: m.id, nom: m.nom, boucle: m.boucle, co2j: co2j, co2n: co2n, hum: hum, co: co, filtreAge: age, filtreDuree: duree };
    });
    // faux positif : un relevé limite ailleurs
    var autres = releves.filter(function (r) { return r.id !== cible; });
    if (autres.length) {
      var fp = rng.pick(autres);
      if (rng.chance(0.5)) fp.filtreAge = rng.range(31, 36); else fp.hum = rng.range(62, 69);
    }
    var epurateur = causeId === 'SCRUBBER'
      ? { boucle: boucle, rendement: rng.range(31, 48), etat: 'rendement anormal' }
      : { boucle: rng.pick([1, 2]), rendement: rng.range(88, 97), etat: 'nominal' };
    var eau = causeId === 'EAU'
      ? { cuve: rng.pick(['B', 'C']), turbidite: (rng.range(24, 52) / 10).toFixed(1), chlore: (rng.range(1, 6) / 100).toFixed(2), depuis: rng.range(4, 9) }
      : { cuve: rng.pick(['A', 'B']), turbidite: (rng.range(2, 8) / 10).toFixed(1), chlore: (rng.range(28, 44) / 100).toFixed(2), depuis: rng.range(9, 25) };
    var groupe = { charge: rng.range(86, 98), cycle: '22 h 00 – 06 h 00', heures: rng.range(2100, 3400) };

    var skillClueTech = null, skillClueTech2 = null, skillClueCrew = null;
    if (talentHas(st,'tech','diag1')) {
      skillClueTech = causeId === 'FILTRE' ? 'La dérive est localisée à un module et suit exactement l’âge du filtre.'
        : causeId === 'FUITE' ? 'Le pic de CO apparaît uniquement sur le cycle du groupe, côté Dortoir B.'
        : causeId === 'SCRUBBER' ? 'Deux modules partagent la même anomalie : la boucle commune est suspecte.'
        : causeId === 'EAU' ? 'Les personnes qui évitent le thé sont les seules à présenter le même tableau.'
        : 'L’humidité anormale et la toux restent confinées au même module.';
    }
    if (talentHas(st,'tech','diag2')) {
      skillClueTech2 = (causeId === 'FILTRE' || causeId === 'SCRUBBER')
        ? 'La concentration augmente surtout la nuit : le renouvellement d’air ne compense plus la charge.'
        : causeId === 'FUITE' ? 'Le CO et les symptômes disparaissent hors du cycle de combustion.'
        : causeId === 'EAU' ? 'La chronologie des symptômes suit la mise en service de la cuve contaminée.'
        : 'Le signal d’humidité précède les symptômes respiratoires : ce n’est pas une simple fatigue.';
    }
    if (talentHas(st,'equipage','triage2')) {
      skillClueCrew = causeId === 'EAU' ? 'Le tableau digestif partagé, sans fièvre, pointe vers une exposition commune plutôt qu’une infection individuelle.'
        : causeId === 'FUITE' ? 'Le fait que les vertiges cessent dehors est un indice d’exposition à l’air intérieur.'
        : causeId === 'SCRUBBER' ? 'La somnolence et l’essoufflement touchent plusieurs personnes selon la même zone de couchage.'
        : causeId === 'MOISISSURE' ? 'Toux + gorge irritée + yeux qui piquent : le regroupement est très localisé.'
        : 'La fatigue et les céphalées suivent la même zone de couchage, pas les mêmes habitudes individuelles.';
    }
    if (talentHas(st,'equipage','rehyd1') && causeId === 'EAU') skillClueCrew = (skillClueCrew ? skillClueCrew + ' ' : '') + 'La perte hydrique probable est cohérente avec une contamination de l’eau plutôt qu’avec une simple fatigue.';
    if (st.eventPressures && st.eventPressures.instrument > 0) {
      var capteursSuspects = releves.filter(function(r){ return r.id !== cible; });
      if (capteursSuspects.length) {
        var fauxCapteur = rng.pick(capteursSuspects);
        fauxCapteur.hum = Math.min(88, fauxCapteur.hum + 12);
        fauxCapteur.filtreAge = Math.min(42, fauxCapteur.filtreAge + 7);
      }
      if (talentHas(st,'tech','metrologie1')) skillClueTech2 = (skillClueTech2 ? skillClueTech2 + ' ' : '') + 'Une dérive ancienne perturbe encore un capteur secondaire : sa valeur brute ne doit pas être traitée comme une mesure physique certaine.';
    }
    var partageClues = [];
    if (talentHas(st,'coop','partage1')) partageClues.push('Indice croisé : les symptômes suivent la géographie des modules plus que les personnes elles-mêmes.');
    if (talentHas(st,'coop','partage2')) partageClues.push(causeId === 'SCRUBBER' ? 'Double lecture : les modules touchés partagent une même boucle de ventilation.' : causeId === 'EAU' ? 'Double lecture : l’exposition suit une même source de consommation.' : 'Double lecture : le signal technique et le vécu humain désignent le même module.');

    return {
      type: 'diagnostic',
      titre: 'Diagnostic croisé',
      chapeau: 'Plusieurs personnes vont mal. Nadia veut un nom sur ce qui se passe avant de traiter à l\'aveugle.',
      causeVraie: causeId, cible: cible, boucle: boucle, skillClueTech: skillClueTech, skillClueTech2: skillClueTech2, skillClueCrew: skillClueCrew, partageClues: partageClues,
      symptomes: symptomes, exempt: exempt ? { nom: exempt.prenom, couchage: exempt.couchage, raison: exemptRaison } : null,
      leurre: leurre, releves: releves, epurateur: epurateur, eau: eau, groupe: groupe,
      equipage: eq.map(function (c) {
        return { nom: c.prenom, role: c.role, couchage: st.modules[c.couchage] ? st.modules[c.couchage].nom : '—', couchageId: c.couchage, rythme: c.rythme, boisson: c.boisson };
      }),
      widths: [3, 3, 2],
      defaut: [0, 5, 0]
    };
  }

  function resDiagnostic(st, cr, dec, rng) {
    var iCause = dec[0] % CAUSES.length, iFix = dec[1] % FIXES.length;
    var cause = CAUSES[iCause], fix = FIXES[iFix];
    var vrai = CAUSES.find(function (c) { return c.id === cr.causeVraie; });
    var tech = [], crewR = [], shared = [];
    var dI = 0, dC = 0;

    var causeBonne = cause.id === vrai.id;
    var fixBon = fix.id === vrai.fix;
    var bon = causeBonne && fixBon;
    var bonGesteMauvaiseHypothese = !causeBonne && fixBon;
    var palliatif = fix.id === 'PALLIATIF';

    if (bon) {
      tech.push({ t: 'good', txt: 'Cause confirmée : ' + vrai.nom + '. L\'intervention a réglé le problème à la source.' });
      shared.push('Le lendemain, tout le monde respirait mieux. Nadia a noté la cause au tableau.');
      dI += 2; dC += 4;
      st.dette = st.dette.filter(function (d) { return !(d.type === 'diagnostic' && d.cause === cr.causeVraie); });
      cr.symptomes.forEach(function (s) { applySante(st, s.id, +12); applyMoral(st, s.id, +5); });
      crewR.push({ t: 'good', txt: 'Les symptômes ont reculé en moins de deux jours.' });
    } else if (bonGesteMauvaiseHypothese) {
      tech.push({ t: 'warn', txt: 'Le geste était compatible avec le problème, mais le diagnostic annoncé était faux. La cause réelle était : ' + vrai.nom + '.' });
      shared.push('Le bon geste a limité les dégâts, mais la cause n\'a pas été confirmée. Le problème peut encore revenir.');
      dI -= 1; dC += 1;
      cr.symptomes.forEach(function (s) { applySante(st, s.id, +6); });
      st.dette.push({ type: 'diagnostic', cause: cr.causeVraie, cible: cr.cible, boucle: cr.boucle, jour: st.jour });
      crewR.push({ t: 'warn', txt: 'Les symptômes ont diminué, mais la cause n\'est pas confirmée.' });
    } else if (palliatif) {
      tech.push({ t: 'warn', txt: 'Ventilation manuelle et module évacué. La cause reste inconnue : ' + vrai.nom + ' continue d\'agir, en sourdine.' });
      shared.push('On a ouvert, ventilé, déplacé les gens. Ça soulage. Ça ne règle rien.');
      dI -= 3; dC -= (talentHas(st,'coop','coord2') ? 1 : 2);
      cr.symptomes.forEach(function (s) { applySante(st, s.id, +4); });
      st.dette.push({ type: 'diagnostic', cause: cr.causeVraie, cible: cr.cible, boucle: cr.boucle, jour: st.jour });
      crewR.push({ t: 'warn', txt: 'Les symptômes stagnent. Personne n\'est dupe.' });
    } else {
      tech.push({ t: 'bad', txt: 'Intervention sur la mauvaise piste. La vraie cause était : ' + vrai.nom + '.' });
      shared.push('Deux jours perdus, du matériel consommé, et les malades toujours malades.');
      dI -= 8; dC -= (talentHas(st,'equipage','psy1') ? 7 : 9); if (talentHas(st,'coop','coord2')) dC += 2;
      cr.symptomes.forEach(function (s) { applySante(st, s.id, talentHas(st,'equipage','triage1') ? -10 : -13); applyMoral(st, s.id, -10); });
      st.dette.push({ type: 'diagnostic', cause: cr.causeVraie, cible: cr.cible, boucle: cr.boucle, jour: st.jour });
      crewR.push({ t: 'bad', txt: 'L\'état des malades s\'est aggravé. Nadia a demandé qu\'on reprenne le raisonnement de zéro.' });
    }
    return {
      tech: tech, crew: crewR, shared: shared, dIntegrite: dI, dCohesion: dC,
      journal: {
        titre: bon ? 'Cause trouvée : ' + vrai.nom.toLowerCase() : bonGesteMauvaiseHypothese ? 'Bon geste, mauvais diagnostic' : palliatif ? 'Paré sans comprendre' : 'Mauvaise piste',
        txt: bon ? 'Diagnostic juste du premier coup.' : bonGesteMauvaiseHypothese ? 'Le geste était pertinent, mais la cause n\'a pas été identifiée. Elle reste à surveiller.' : palliatif ? 'On a gagné du temps contre du matériel. La cause court toujours.' : 'On a traité ce qui n\'était pas malade.'
      }
    };
  }

  /* ============================================================
     CRISE 3 — LA TEMPÊTE
     Lui : les tâches, les compétences exigées, les heures, ce qui casse.
     Elle : qui sait faire, qui tient debout, qui panique dehors.
     ============================================================ */
  var TACHES = [
    { id: 't1', nom: 'Arrimer les panneaux de l\'antenne', sk: 'soudure', niv: 1, h: 3, sev: 6, ext: true, csq: 'Les panneaux partent au vent et découvrent le toit du Carré.' },
    { id: 't2', nom: 'Purger la conduite de fioul', sk: 'mecanique', niv: 2, h: 2, sev: 7, ext: false, csq: 'Le fioul se fige dans la conduite : plus de groupe pendant la tempête.' },
    { id: 't3', nom: 'Renforcer la porte du sas ouest', sk: 'soudure', niv: 2, h: 4, sev: 9, ext: true, csq: 'La porte cède. On perd le sas et une partie de la réserve.' },
    { id: 't4', nom: 'Basculer le réseau sur la batterie tampon', sk: 'electricite', niv: 2, h: 2, sev: 7, ext: false, csq: 'Une coupure et tout s\'éteint d\'un coup, chauffage compris.' },
    { id: 't5', nom: 'Rentrer le matériel de carottage', sk: 'logistique', niv: 1, h: 3, sev: 4, ext: true, csq: 'Six mois de carottes de glace ensevelies. Perte sèche pour la science.' },
    { id: 't6', nom: 'Haubaner l\'antenne radio', sk: 'informatique', niv: 1, h: 2, sev: 8, ext: true, csq: 'Plus de radio : aucun contact avec la base côtière jusqu\'au printemps.' },
    { id: 't7', nom: 'Dégager les prises d\'air du toit', sk: 'mecanique', niv: 1, h: 2, sev: 5, ext: true, csq: 'Les prises d\'air se bouchent : l\'air devient irrespirable module par module.' },
    { id: 't8', nom: 'Mettre la serre en survie', sk: 'science', niv: 1, h: 2, sev: 6, ext: false, csq: 'Les cultures gèlent. Retour aux conserves jusqu\'au printemps.' },
    { id: 't9', nom: 'Sangler la chenillette et vider son circuit', sk: 'pilotage', niv: 1, h: 3, sev: 5, ext: true, csq: 'La chenillette est retournée par le vent. Plus de sorties possibles.' }
  ];

  function genTempete(st, rng) {
    var eq = actifs(st);
    var fenetre = rng.range(6, 9);
    if (st.eventPressures && st.eventPressures.sommeil > 0) fenetre = Math.max(5, fenetre - 1);
    var dispo = TACHES.filter(function (t) {
      if (t.id === 't8' && !st.modules.SERRE.built) return false;
      return true;
    });
    var n = Math.min(5, Math.max(4, eq.length));
    var taches = rng.picks(dispo, n).map(function (t) {
      return Object.assign({}, t, { h: Math.max(1, t.h + (rng.chance(0.3) ? 1 : 0)), sev: t.sev + (st.annee - 1) * 3 - (talentHas(st,'tech','struct1') ? 1 : 0) });
    });
    var vent = rng.range(110, 165) + (st.annee - 1) * 10;

    return {
      type: 'tempete',
      titre: 'La tempête',
      chapeau: 'Le front arrive dans ' + fenetre + ' heures, ' + vent + ' km/h annoncés. Il y a plus de travail que d\'heures disponibles.',
      fenetre: fenetre, vent: vent, taches: taches, eq: eq,
      fiches: eq.map(function (c) {
        var certs = Object.keys(c.sk).map(function (k) { return SKILL_LABEL[k] + ' niv. ' + c.sk[k]; });
        var etat = c.etat === 'blesse' ? 'blessé — ' + (c.bobo || 'main immobilisée')
          : c.etat === 'malade' ? 'malade — ' + (c.bobo || 'fiévreux')
            : c.sante < 60 ? 'épuisé, tient sur les nerfs'
              : c.moral < 45 ? 'moral au plus bas' : 'en état de travailler';
        return { id: c.id, nom: c.prenom, role: c.role, certs: certs, etat: etat, trait: c.trait.label, traitId: c.trait.id, note: c.trait.note };
      }),
      widths: taches.map(function () { return 3; }).concat([2]),
      defaut: taches.map(function (_, i) { return Math.min(eq.length, i % (eq.length + 1)); }).concat([0])
    };
  }

  function resTempete(st, cr, dec, rng) {
    var SKIP = cr.eq.length; // dernière valeur = ne pas faire
    var assign = dec.slice(0, cr.taches.length).map(function (v) { return v > cr.eq.length ? SKIP : v; });
    var tech = [], crewR = [], shared = [];
    var dI = 0, dC = 0;
    var heures = {};

    cr.taches.forEach(function (t, i) {
      var ai = assign[i];
      if (ai === SKIP) {
        dI -= t.sev;
        tech.push({ t: 'bad', txt: 'Non faite — ' + t.nom + '. ' + t.csq });
        shared.push(t.csq);
        return;
      }
      var c = cr.eq[ai];
      if (!c) { dI -= t.sev; tech.push({ t: 'bad', txt: 'Non faite — ' + t.nom + '.' }); return; }
      heures[c.id] = (heures[c.id] || 0) + t.h;
      var niv = c.sk[t.sk] || 0;
      var real = st.crew.find(function (x) { return x.id === c.id; });
      var preference = real && real.preference ? real.preference.skill : null;
      var traumaExterieur = real && Array.isArray(real.memoire) && real.memoire.some(function(m){ return m.indexOf('alerte structurelle mal coordonnée') >= 0; });
      var detteSommeil = real && Array.isArray(real.memoire) && real.memoire.some(function(m){ return m.indexOf('période d’épuisement') >= 0 || m.indexOf("période d'épuisement") >= 0; });
      var procheLien = real && real.procheId ? relOf(st, real.id, real.procheId) : 0;
      var procheFragileStorm = false;
      if (real && real.procheId) {
        var pclose = st.crew.find(function (x) { return x.id === real.procheId; });
        procheFragileStorm = !!(pclose && pclose.etat !== 'perdu' && (pclose.sante < 55 || pclose.etat === 'malade' || pclose.etat === 'blesse' || pclose.etat === 'critique'));
      }

      if (niv === 0) {
        dI -= Math.round(t.sev * (talentHas(st,'tech','struct2') ? 0.65 : 0.8));
        tech.push({ t: 'bad', txt: 'Échec — ' + t.nom + ' : personne de non qualifié en ' + SKILL_LABEL[t.sk] + '. ' + t.csq });
        crewR.push({ t: 'bad', txt: c.nom.split(' ')[0] + ' a essayé. Ce n\'était pas son métier, et ça s\'est vu.' });
        applyMoral(st, c.id, -10);
        if (t.ext && rng.chance(0.45)) { applySante(st, c.id, talentHas(st,'equipage','plaies1') ? -12 : -18, 'gelures aux mains'); setEtat(st, c.id, 'blesse', 'gelures aux mains'); crewR.push({ t: 'bad', txt: c.nom.split(' ')[0] + ' est rentré avec les mains gelées.' }); }
      } else if (niv < t.niv) {
        dI -= Math.round(t.sev * 0.35);
        tech.push({ t: 'warn', txt: 'Partiel — ' + t.nom + ' : niveau ' + niv + ' pour un travail de niveau ' + t.niv + '. Ça tiendra peut-être.' });
        applySante(st, c.id, -7); applyMoral(st, c.id, -3);
      } else if (t.ext && c.trait.id === 'exterieur') {
        dI -= Math.round(t.sev * 0.5);
        tech.push({ t: 'bad', txt: 'Abandonnée en cours — ' + t.nom + '.' });
        crewR.push({ t: 'bad', txt: c.nom.split(' ')[0] + ' est ressorti au bout de dix minutes, incapable de continuer dans le vent. On le savait.' });
        applyMoral(st, c.id, -14);
      } else if (real && (real.etat === 'malade' || real.etat === 'blesse')) {
        dI -= Math.round(t.sev * 0.25);
        tech.push({ t: 'warn', txt: 'Fait, mal — ' + t.nom + '.' });
        applySante(st, c.id, -16, 'a travaillé en étant déjà atteint');
        crewR.push({ t: 'bad', txt: c.nom.split(' ')[0] + ' a fait le travail alors qu\'' + (genre(c) === 'il' ? 'il' : 'elle') + ' n\'était déjà pas en état. Ça se paiera.' });
      } else {
        tech.push({ t: 'good', txt: 'Fait — ' + t.nom + '.' });
        applyMoral(st, c.id, preference === t.sk ? +6 : +4);
        if (preference === t.sk) crewR.push({ t: 'ok', txt: c.nom.split(' ')[0] + ' est particulièrement à l’aise sur ' + SKILL_LABEL[t.sk] + '.' });
        if (t.ext) {
          applySante(st, c.id, traumaExterieur ? -5 : -3);
          if (procheLien >= 2 && procheFragileStorm) {
            dI -= Math.max(1, Math.round(t.sev * 0.12));
            applyMoral(st, c.id, -3);
            crewR.push({ t: 'warn', txt: c.nom.split(' ')[0] + ' perd du temps dehors : ' + nomOf(st, real.procheId) + ' reste en difficulté à l’intérieur.' });
          }
          if (traumaExterieur) {
            dI -= Math.max(1, Math.round(t.sev * 0.15));
            applyMoral(st, c.id, -4);
            crewR.push({ t: 'warn', txt: c.nom.split(' ')[0] + ' hésite devant la zone extérieure après l’ancien incident structurel. La tâche prend plus de temps.' });
          }
        }
      }
    });

    // Les liens forts ont un coût quand un proche est déjà fragilisé.
    cr.eq.forEach(function (c) {
      var real = st.crew.find(function (x) { return x.id === c.id; });
      if (!real || !real.procheId) return;
      var proche = st.crew.find(function (x) { return x.id === real.procheId; });
      if (!proche || proche.etat === 'perdu') return;
      if (proche.sante < 55) {
        applyMoral(st, real.id, -3);
        crewR.push({ t: 'warn', txt: real.prenom + ' garde un œil sur ' + proche.prenom + '. La relation pèse sur sa concentration.' });
      }
    });

    // dépassement horaire
    Object.keys(heures).forEach(function (id) {
      if (heures[id] > cr.fenetre) {
        var c = st.crew.find(function (x) { return x.id === id; });
        dI -= 5;
        tech.push({ t: 'bad', txt: (c ? c.prenom : '?') + ' : ' + heures[id] + ' h de travail affectées pour une fenêtre de ' + cr.fenetre + ' h. La dernière tâche a été bâclée.' });
        var relc = st.crew.find(function(x){return x.id===id;});
        var detteSommeil = relc && Array.isArray(relc.memoire) && relc.memoire.some(function(m){ return m.indexOf('période d’épuisement') >= 0 || m.indexOf('période d\'épuisement') >= 0; });
        var perte = talentHas(st,'equipage','fatigue1') ? -9 : -14;
        if (detteSommeil) perte -= 3;
        applySante(st, id, perte, 'épuisement'); applyMoral(st, id, -8);
        if (detteSommeil) crewR.push({t:'warn',txt:(relc ? relc.prenom : '?') + ' paie encore une ancienne dette de sommeil.'});
      } else if (heures[id] >= cr.fenetre - 1) {
        applySante(st, id, -6);
      }
    });

    var faites = cr.taches.filter(function (t, i) { return assign[i] !== SKIP; }).length;
    if (dI === 0) { dC += 6; shared.push('La tempête a passé sur une station entièrement arrimée. Personne n\'y croyait.'); }
    return {
      tech: tech, crew: crewR, shared: shared, dIntegrite: dI, dCohesion: dC,
      journal: {
        titre: 'Tempête, ' + cr.vent + ' km/h',
        txt: faites + ' tâche' + (faites > 1 ? 's' : '') + ' sur ' + cr.taches.length + ' menée' + (faites > 1 ? 's' : '') + ' avant le front. ' + (dI === 0 ? 'Rien n\'a cédé.' : dI < -12 ? 'La station a encaissé des dégâts.' : 'Quelques pertes, rien d\'irréparable.')
      }
    };
  }

  /* ============================================================
     ÉVÉNEMENTS — conséquences intermédiaires, déterministes
     Les trois premières crises restent fixes. Ensuite, de petits
     événements obligent les deux postes à interpréter la même situation.
     ============================================================ */
  var EVENEMENTS = [
    { id:'radio', titre:'Message dans la nuit', tech:['Canal 3','Canal 7','Canal 12'], crew:['Nadia','Personne d’autre','Toute l’équipe'], techGood:2 },
    { id:'medical', titre:'Le malaise', tech:['Observation 6 h','Isolement','Intervention immédiate'], crew:['La personne la plus atteinte','La personne la plus fatiguée','La personne qui minimise'], techGood:1 },
    { id:'structure', titre:'Craquement dans la structure', tech:['Contenir la zone','Couper le module','Laisser travailler la structure'], crew:['Sortir inspecter','Rester en observation','Préparer l’évacuation'], techGood:0 }
  ];
  // Pack de deuxième hivernage : on laisse le premier hiver inchangé pour préserver
  // les anciennes sauvegardes et introduire progressivement des problèmes plus spécialisés.
  var EVENEMENTS_V2 = [
    { id:'instrument', titre:'Dérive de l’instrument', tech:['Recalibrer à froid','Ignorer jusqu’à demain','Remplacer le module de mesure'], crew:['Continuer la série','Suspendre les prélèvements','Documenter l’anomalie'], techGood:0 },
    { id:'eau', titre:'Eau trouble', tech:['Purger la conduite','Changer le filtre','Surveiller 24 h'], crew:['Limiter les boissons','Chercher des symptômes','Ne rien modifier'], techGood:1 },
    { id:'sommeil', titre:'Relève impossible', tech:['Réduire la charge nocturne','Déplacer la relève','Forcer le planning'], crew:['Réorganiser les binômes','Maintenir le planning','Donner la relève à l’épuisé'], techGood:0 }
  ];
  function genEvenement(st, rng) {
    var actifsEq = actifs(st);
    var pool = st.annee > 1 ? EVENEMENTS.concat(EVENEMENTS_V2) : EVENEMENTS;
    var debts = st.dette.filter(function(d){ return d.type==='evenement' && pool.some(function(e){return e.id===d.eventId;}); });
    var e = null;
    if (debts.length && rng.chance(0.72)) e = pool.find(function(x){return x.id===debts[0].eventId;});
    if (!e) e = rng.pick(pool);
    var cible = rng.pick(actifsEq);
    var techLabels = e.tech.slice();
    var crewLabels = e.crew.map(function(x){ return x === 'Nadia' ? cible.prenom : x; });
    if (e.id === 'radio' && talentHas(st,'tech','diag1')) techLabels.push('Écouter le signal brut');
    if (e.id === 'instrument' && talentHas(st,'tech','metrologie1')) techLabels.unshift('Lire la dérive instrument par instrument');
    var skillClueCrew = null, skillClueTech = null;
    if (e.id === 'medical' && talentHas(st,'equipage','const1')) skillClueCrew = cible.prenom + ' : respiration régulière, pouls ralenti et récupération en deux minutes. L’urgence vitale paraît faible, mais l’épisode mérite surveillance.';
    if (e.id === 'medical' && talentHas(st,'equipage','rehyd1')) skillClueCrew = (skillClueCrew ? skillClueCrew + ' ' : '') + 'La muqueuse buccale est sèche et la diurèse est basse : une déshydratation est plausible.';
    if (e.id === 'structure' && talentHas(st,'tech','palier1')) skillClueTech = 'Le spectre de vibration est localisé autour du palier : le désalignement reste possible, mais une surcharge pure est peu probable.';
    if (e.id === 'structure' && talentHas(st,'tech','metrologie1')) skillClueTech = (skillClueTech ? skillClueTech + ' ' : '') + 'Le capteur de contrainte dérive de 6 % : sa valeur brute doit être interprétée avec prudence.';
    if (e.id === 'instrument' && talentHas(st,'tech','diag2')) skillClueTech = 'Deux capteurs dérivent différemment : l’anomalie ressemble davantage à un problème de mesure qu’à une variation physique réelle.';
    if (e.id === 'eau' && talentHas(st,'equipage','rehyd1')) skillClueCrew = 'La sécheresse buccale et une diurèse faible chez plusieurs personnes orientent vers une déshydratation ; le symptôme n’est pas spécifique.';
    if (e.id === 'sommeil' && talentHas(st,'equipage','psy1')) skillClueCrew = 'Deux binômes montrent une irritabilité inhabituelle. Le problème semble davantage organisationnel que relationnel.';
    var chapeau = e.id === 'instrument' ? 'Une série scientifique commence à dériver. Le problème n’est peut-être pas dans la banquise, mais dans ce qui la mesure.'
      : e.id === 'eau' ? 'L’eau du robinet présente une légère turbidité. Les données techniques et les premiers symptômes ne racontent pas exactement la même histoire.'
      : e.id === 'sommeil' ? 'La relève de nuit ne tient plus. La station fonctionne encore, mais les personnes qui la font fonctionner commencent à manquer de sommeil.'
      : e.id === 'radio' ? 'Un signal faible traverse la nuit. Vous avez peu de temps avant qu’il disparaisse.'
      : e.id === 'medical' ? cible.prenom + ' vient de faire un malaise. Les informations utiles sont réparties entre les deux postes.'
      : 'La station vient de bouger. Un craquement a été entendu dans la structure ouest.';
    return {
      type:'evenement', eventId:e.id, titre:e.titre,
      chapeau:chapeau, techChoices:techLabels, crewChoices:crewLabels, cible:cible.id, skillClueCrew:skillClueCrew, skillClueTech:skillClueTech,
      techGood:e.techGood, widths:[techLabels.length,crewLabels.length,2], defaut:[0,0,0], chantiers:chantiersDispo(st)
    };
  }
  function resEvenement(st, cr, dec) {
    var e = EVENEMENTS.concat(EVENEMENTS_V2).find(function(x){return x.id===cr.eventId;});
    var tech=[], crewR=[], shared=[], dI=0,dC=0;
    var ti=dec[0], ci=dec[1];
    var bonTech = ti === cr.techGood;
    var bonCrew = (cr.eventId==='radio' ? ci===0 : cr.eventId==='medical' ? ci===0 : cr.eventId==='sommeil' ? ci===0 : ci===1);
    if (cr.eventId==='radio') {
      if (bonTech && bonCrew) { dC+=4; shared.push('Le signal a été accroché au bon moment. Quelques mots seulement, mais ils prouvent que la base vous entend encore.'); tech.push({t:'good',txt:'Le canal choisi a livré un signal exploitable.'}); crewR.push({t:'good',txt:'La transmission a été courte et claire.'}); }
      else if (bonTech || bonCrew) { dI-=2; dC+=1; shared.push('Le signal a été partiellement compris. Impossible de savoir si la base a reçu la réponse.'); tech.push({t:bonTech?'good':'warn',txt:bonTech?'Le canal était le bon, mais le relais humain a brouillé le message.':'Le choix technique n’était pas idéal, mais la parole a sauvé une partie de la transmission.'}); }
      else { dI-=5; dC-=3; shared.push('Le signal est mort avant qu’on puisse en tirer quelque chose.'); tech.push({t:'bad',txt:'Mauvais canal et mauvaise fenêtre d’écoute.'}); crewR.push({t:'warn',txt:'Personne ne sait si quelqu’un, dehors, a entendu.'}); }
    } else if (cr.eventId==='instrument') {
      if (bonTech && bonCrew) { dC+=3; if (st.eventPressures) st.eventPressures.instrument=0; shared.push('La dérive a été isolée comme un problème d’instrumentation. La série scientifique peut reprendre sans jeter les mesures précédentes.'); }
      else if (bonTech || bonCrew) { dC-=1; dI-=1; if (st.eventPressures) st.eventPressures.instrument=Math.max(st.eventPressures.instrument||0,1); shared.push('Les mesures restent exploitables, mais une partie de la série devra être annotée comme douteuse. Une petite dérive restera à surveiller.'); }
      else { dI-=3; dC-=2; if (st.eventPressures) st.eventPressures.instrument=2; st.dette.push({type:'evenement',eventId:'instrument',jour:st.jour,cause:'dérive non traitée'}); shared.push('La dérive a été laissée dans la série. La station travaille désormais avec des données dont personne n’est sûr ; les capteurs porteront encore cette erreur.'); }
    } else if (cr.eventId==='eau') {
      if (bonTech && bonCrew) { dC+=3; if (st.eventPressures) st.eventPressures.eau=0; shared.push('Le traitement de l’eau a corrigé la turbidité avant qu’elle ne devienne un problème sanitaire.'); }
      else if (bonTech || bonCrew) { dC-=1; if (st.eventPressures) st.eventPressures.eau=Math.max(st.eventPressures.eau||0,1); applySante(st,cr.cible,-3,'exposition à une eau douteuse'); shared.push('Le problème est contenu, mais une personne commence à présenter des symptômes légers. La qualité de l’eau restera sous surveillance.'); }
      else { dI-=2; dC-=4; if (st.eventPressures) st.eventPressures.eau=3; applySante(st,cr.cible,-8,'déshydratation / eau douteuse'); st.dette.push({type:'evenement',eventId:'eau',jour:st.jour,cause:'eau non traitée'}); shared.push('La turbidité a été ignorée. L’eau continue d’être consommée et pèsera sur les prochains diagnostics.'); }
    } else if (cr.eventId==='sommeil') {
      if (bonTech && bonCrew) { dC+=4; if (st.eventPressures) st.eventPressures.sommeil=0; shared.push('La relève a été réorganisée avant qu’une erreur de fatigue ne devienne un accident.'); }
      else if (bonTech || bonCrew) { dC+=0; if (st.eventPressures) st.eventPressures.sommeil=Math.max(st.eventPressures.sommeil||0,1); applyMoral(st,cr.cible,-3); shared.push('Le planning tient encore, mais la dette de sommeil commence à se voir. La prochaine tempête laissera moins de marge.'); }
      else { dI-=2; dC-=5; if (st.eventPressures) st.eventPressures.sommeil=2; applySante(st,cr.cible,-5,'épuisement'); st.dette.push({type:'evenement',eventId:'sommeil',jour:st.jour,cause:'dette de sommeil'}); shared.push('La relève a été maintenue malgré l’épuisement. Une erreur devient maintenant beaucoup plus probable, notamment sous tempête.'); }
    } else if (cr.eventId==='medical') {
      if (bonTech && bonCrew) { dC+=3; shared.push('Le malaise a été pris au sérieux sans immobiliser toute la station.'); tech.push({t:'good',txt:'La bonne fenêtre d’observation a permis de distinguer un incident transitoire d’une aggravation.'}); applySante(st,cr.cible,+10); applyMoral(st,cr.cible,+3); }
      else if (bonTech || bonCrew) { dC-=1; applySante(st,cr.cible,+4); shared.push('On a stabilisé la situation, mais sans comprendre tout de suite ce qui l’avait provoquée.'); }
      else { dI-=2; dC-=5; applySante(st,cr.cible,-10,'malaise mal pris en charge'); applyMoral(st,cr.cible,-8); shared.push('On a minimisé les signaux. Le malaise a laissé une trace.'); }
    } else {
      if (bonTech && bonCrew) { dC+=5; if (talentHas(st,'tech','palier1')) dI += 2; shared.push('La structure a été contenue sans envoyer quelqu’un inutilement dans la zone instable.'); }
      else if (bonTech || bonCrew) { dI-=3; dC-=1; shared.push('La zone tient, mais une mauvaise coordination a coûté du matériel et du temps.'); }
      else { dI-=8; dC-=5; shared.push('Le craquement était réel. La station a encaissé le mauvais choix.'); }
      if (!bonTech) tech.push({t:'bad',txt:'La décision technique n’a pas traité le bon risque structurel.'}); else tech.push({t:'good',txt:'La réponse technique a contenu la zone.'});
      if (!bonCrew) crewR.push({t:'warn',txt:'Le mouvement de l’équipage n’était pas adapté au risque.'}); else crewR.push({t:'good',txt:'L’équipage est resté hors de la zone dangereuse.'});
    }
    if (!bonTech && talentHas(st,'coop','coord2')) dC += 2;
    if (cr.eventId === 'medical') {
      if (bonTech && bonCrew) {
        memoire(st, cr.cible, 'un malaise pris au sérieux');
        var best = st.crew.filter(function(c){ return c.id !== cr.cible && c.etat !== 'perdu'; }).sort(function(a,b){ return relOf(st,cr.cible,b.id)-relOf(st,cr.cible,a.id); })[0];
        if (best) { bumpRel(st, cr.cible, best.id, 1); memoire(st, best.id, 'a veillé sur ' + nomOf(st, cr.cible)); }
      } else if (!bonTech && !bonCrew) {
        memoire(st, cr.cible, 'un malaise minimisé');
      }
    }
    if (cr.eventId === 'instrument' && !bonTech) memoire(st, cr.cible, 'une série scientifique laissée douteuse');
    if (cr.eventId === 'eau' && !bonTech) memoire(st, cr.cible, 'une exposition à une eau douteuse');
    if (cr.eventId === 'sommeil' && !bonCrew) memoire(st, cr.cible, 'une période d’épuisement');
    if (cr.eventId === 'structure') memoire(st, cr.cible, bonTech && bonCrew ? 'une alerte structurelle bien gérée' : 'une alerte structurelle mal coordonnée');
    if (bonTech && bonCrew) {
      st.dette = st.dette.filter(function(d){ return !(d.type==='evenement' && d.eventId===cr.eventId); });
    }
    return {tech:tech,crew:crewR,shared:shared,dIntegrite:dI,dCohesion:dC,journal:{titre:cr.titre,txt:shared[0] || 'Incident contenu.',important:talentHas(st,'coop','memoire1') && (dI<0 || dC<0 || st.dette.some(function(d){return d.type==='evenement';}))}};
  }

  /* ---------- effets sur l'équipage ---------- */
  function nomOf(st, id) { var c = st.crew.find(function (x) { return x.id === id; }); return c ? c.prenom : '?'; }
  function genre(c) {
    if (!c || !c.prenom) return 'il';
    return ['Nadia', 'Wren', 'Soline', 'Mira'].indexOf(c.prenom) >= 0 ? 'elle' : 'il';
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function applySante(st, id, d, motif) {
    var c = st.crew.find(function (x) { return x.id === id; });
    if (!c) return;
    c.sante = clamp(c.sante + d, 0, 100);
    if (d < 0 && motif) {
      c.bobo = motif;
      if (d <= -8) memoire(st, id, motif);
    }
    if (c.sante <= 0) { c.etat = 'critique'; c.bobo = motif || c.bobo || 'état critique'; }
