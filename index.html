  function rendreReception() {
    var box = vide($('ecran-transmission'));
    var champ = H('input', { type: 'text', id: 'champ-code', maxlength: '12', placeholder: 'CODE', autocapitalize: 'characters', autocomplete: 'off' });
    var err = H('div', { class: 'erreur' });
    box.appendChild(H('div', { class: 'pile' },
      H('div', {},
        H('span', { class: 'etiquette', text: 'Réception' }),
        H('h2', { class: 'titre-bloc', text: 'Code reçu' })
      ),
      H('p', { class: 'prose', text: 'Saisis le code que ton binôme vient de valider. Il porte une somme de contrôle : un caractère faux est refusé plutôt que de faire dériver la station.' }),
      champ, err,
      H('button', {
        class: 'btn-large btn-primaire', onclick: function () {
          var r = B.readCode(st, cr, champ.value);
          if (!r) { err.textContent = 'Code refusé. Vérifie les caractères, un par un.'; return; }
          dec = r.dec;
          appliquer(r.payload);
        }
      }, 'Appliquer'),
      H('button', { class: 'btn-large btn-discret', onclick: function () { rendreCrise(); aller('crise'); } }, 'Retour')
    ));
  }

  function appliquer(payload) {
    var crSauve = cr;
    var decSauve = dec.slice();
    save.decisions.push(payload);
    enregistrer();
    var avant = { integrite: st.integrite, cohesion: st.cohesion };
    var stAvant = st;
    var resultat = B.resolve(stAvant, crSauve, decSauve);
    st = stAvant;
    recalculerApres(resultat, crSauve, avant);
  }

  function recalculerApres(resultat, crSauve, avant) {
    rendreResolution(resultat, crSauve, avant);
    aller('resolution');
    cr = B.crisisFor(st);
    dec = cr ? cr.defaut.slice() : null;
  }

  /* ============================================================
     RÉSOLUTION
     ============================================================ */
  function rendreResolution(r, crSauve, avant) {
    var box = vide($('ecran-resolution'));
    var pile = H('div', { class: 'pile' });
    pile.appendChild(H('div', {},
      H('span', { class: 'etiquette', text: 'Jour ' + (st.jour - 6) + ' · ' + crSauve.titre }),
      H('h2', { class: 'titre-bloc', text: 'Ce qui s\'est passé' })
    ));

    if (r.shared.length) {
      var recit = H('div', { class: 'recit' });
      r.shared.forEach(function (t) { recit.appendChild(H('p', { text: t })); });
      pile.appendChild(recit);
    }

    if (save.poste !== 'equipage' && r.tech.length) {
      var rt = H('div', { class: 'rapport' });
      r.tech.forEach(function (it) { rt.appendChild(H('div', { class: 'item ' + it.t, text: it.txt })); });
      pile.appendChild(H('div', { class: 'caisson pile' }, H('span', { class: 'etiquette', text: 'Relevé technique' }), rt));
    }
    if (save.poste !== 'tech' && r.crew.length) {
      var rc = H('div', { class: 'rapport' });
      r.crew.forEach(function (it) { rc.appendChild(H('div', { class: 'item ' + it.t, text: it.txt })); });
      pile.appendChild(H('div', { class: 'caisson pile' }, H('span', { class: 'etiquette', text: 'Équipage' }), rc));
    }
    if (r.semaine && r.semaine.length) {
      pile.appendChild(H('div', { class: 'caisson pile' },
        H('span', { class: 'etiquette', text: 'La semaine' }),
        H('div', { class: 'rapport' }, r.semaine.map(function (t) { return H('div', { class: 'item', text: t }); }))
      ));
    }

    pile.appendChild(H('div', { class: 'jauges' },
      jauge('Intégrité', st.integrite),
      jauge('Cohésion', st.cohesion)
    ));
    pile.appendChild(H('div', { class: 'caisson' },
      H('span', { class: 'etiquette', text: 'Code d\'état — doit être identique sur les deux téléphones' }),
      H('div', { class: 'etat-code', text: B.stateCode(save) })
    ));
    pile.appendChild(H('button', {
      class: 'btn-large btn-primaire', onclick: function () {
        if (st.fini) { rendreFin(); aller('fin'); } else { rendreHub(); aller('hub'); }
      }
    }, st.fini ? 'Fin de l\'hiver' : 'Continuer'));
    box.appendChild(pile);
  }

  /* ============================================================
     JOURNAL
     ============================================================ */
  function rendreJournal() {
    var box = vide($('ecran-journal'));
    var pile = H('div', { class: 'pile' });
    pile.appendChild(H('div', {},
      H('span', { class: 'etiquette', text: 'Station ' + save.seed }),
      H('h2', { class: 'titre-bloc', text: 'Journal de bord' }),
      H('p', { class: 'prose', text: 'Écrit tout seul, semaine après semaine. C\'est la trace de ce que vous avez décidé — pas de ce que vous auriez voulu décider.' })
    ));
    if (!st.journal.length) {
      pile.appendChild(H('div', { class: 'note-regle', text: 'Rien encore. La première semaine n\'est pas passée.' }));
    }
    var liste = H('div', {});
    st.journal.slice().reverse().forEach(function (e) {
      liste.appendChild(H('div', { class: 'entree' },
        H('div', { class: 'quand', text: 'Hiver ' + e.annee + ' · jour ' + e.jour }),
        H('h3', { text: e.titre }),
        H('p', { text: e.txt + (e.semaine ? ' ' + e.semaine : '') }),
        H('div', { class: 'meta petit', style: 'font-family:var(--mono);font-size:10px;margin-top:5px;color:var(--sourd)', text: 'intégrité ' + e.integrite + ' · cohésion ' + e.cohesion })
      ));
    });
    pile.appendChild(liste);
    pile.appendChild(H('button', { class: 'btn-large btn-discret', onclick: function () { rendreHub(); aller('hub'); } }, 'Retour'));
    box.appendChild(pile);
  }

  /* ============================================================
     SYNCHRONISATION
     ============================================================ */
  function rendreSync() {
    var box = vide($('ecran-journal'));
    var champ = H('input', { type: 'text', id: 'champ-sync', placeholder: 'CODE COMPLET', autocapitalize: 'characters', autocomplete: 'off', style: 'font-size:13px;letter-spacing:.1em' });
    var err = H('div', { class: 'erreur' });
    box.appendChild(H('div', { class: 'pile' },
      H('div', {},
        H('span', { class: 'etiquette', text: 'Synchronisation' }),
        H('h2', { class: 'titre-bloc', text: 'Les deux stations sont-elles la même ?' })
      ),
      H('p', { class: 'prose' }, 'Comparez ce code d\'état. S\'il diffère, une décision n\'a pas été appliquée des deux côtés.'),
      H('div', { class: 'caisson' },
        H('span', { class: 'etiquette', text: 'Code d\'état' }),
        H('div', { class: 'etat-code', text: B.stateCode(save) })
      ),
      H('div', { class: 'caisson pile' },
        H('span', { class: 'etiquette', text: 'Histoire complète de la station' }),
        H('div', { class: 'petit', style: 'font-family:var(--mono);word-break:break-all;color:var(--givre)', text: chaineReprise() }),
        H('div', { class: 'petit', text: 'Toute la partie tient dans cette ligne. Celui qui est en retard la recopie ci-dessous.' })
      ),
      H('div', {}, H('span', { class: 'etiquette', text: 'Adopter une histoire reçue' }), champ),
      err,
      H('button', {
        class: 'btn-large', onclick: function () {
          var v = String(champ.value || '').toUpperCase().replace(/[^0-9A-Z-]/g, '');
          var m = v.split('-').filter(function (x) { return x.length; });
          if (!m.length) { err.textContent = 'Ligne vide.'; return; }
          var ancien = save;
          save = { seed: m[0], decisions: m.slice(1), poste: ancien.poste };
          try { recalculer(); } catch (e) { save = ancien; recalculer(); err.textContent = 'Ligne illisible.'; return; }
          enregistrer();
          if (st.fini) { rendreFin(); aller('fin'); } else { rendreHub(); aller('hub'); }
        }
      }, 'Adopter'),
      H('button', { class: 'btn-large btn-discret', onclick: function () { rendreHub(); aller('hub'); } }, 'Retour')
    ));
    aller('journal');
  }

  /* ============================================================
     FIN D'HIVER
     ============================================================ */
  function rendreFin() {
    var box = vide($('ecran-fin'));
    var pile = H('div', { class: 'pile' });
    var perdus = st.crew.filter(function (c) { return c.etat === 'perdu'; });
    var titre = st.issue === 'printemps' ? 'Le printemps' : st.issue === 'station' ? 'La station a lâché' : 'Plus personne pour tenir';
    var texte = st.issue === 'printemps'
      ? 'Le soleil est repassé au-dessus de l\'horizon le ' + B.JOURS_HIVER + 'ᵉ jour. La station tient encore debout, et vous savez exactement à quel prix.'
      : st.issue === 'station'
        ? 'Trop de systèmes rendus, trop de réparations remises. Il a fallu abandonner Borée en plein hiver.'
        : 'Il ne reste plus assez de monde en état de faire tourner la station. L\'hivernage s\'arrête là.';

    pile.appendChild(H('div', {},
      H('span', { class: 'etiquette', text: 'Hiver ' + st.annee + ' · station ' + save.seed }),
      H('h1', { class: 'titre-geant', style: 'font-size:clamp(40px,14vw,72px)', text: titre }),
      H('p', { class: 'prose', text: texte })
    ));
    pile.appendChild(schema());
    pile.appendChild(H('div', { class: 'jauges' }, jauge('Intégrité', st.integrite), jauge('Cohésion', st.cohesion)));
    if (perdus.length) {
      pile.appendChild(H('div', { class: 'caisson pile' },
        H('span', { class: 'etiquette', text: 'Ne sont pas rentrés' }),
        H('div', {}, perdus.map(function (c) { return H('div', { class: 'prose', text: c.nom + ' — ' + c.role }); }))
      ));
    }
    var construits = Object.keys(st.modules).filter(function (k) { return st.modules[k].built && !['DORTOIR_A', 'DORTOIR_B', 'CARRE', 'LABO', 'MACHINES', 'RESERVE', 'SAS'].includes(k); });
    if (construits.length) {
      pile.appendChild(H('div', { class: 'caisson pile' },
        H('span', { class: 'etiquette', text: 'Construit pendant l\'hiver' }),
        H('div', {}, construits.map(function (k) { return H('div', { class: 'prose', text: st.modules[k].nom }); }))
      ));
    }
    pile.appendChild(H('button', { class: 'btn-large btn-discret', onclick: function () { rendreJournal(); aller('journal'); } }, 'Relire le journal'));
    if (st.issue === 'printemps') {
      pile.appendChild(H('div', { class: 'note-regle', text: 'Un second hivernage repart avec les survivants, une station déjà marquée, et un froid plus dur. Les deux téléphones doivent le lancer, sinon les histoires divergent.' }));
      pile.appendChild(H('button', {
        class: 'btn-large btn-primaire', onclick: function () {
          save.decisions.push('*');
          enregistrer(); recalculer();
          rendreHub(); aller('hub');
        }
      }, 'Hiver ' + (st.annee + 1)));
    }
    pile.appendChild(H('button', {
      class: 'btn-large btn-discret', onclick: function () {
        if (!confirm('Abandonner cette station et revenir au menu ?')) return;
        rendreAccueil(); aller('accueil');
      }
    }, 'Menu'));
    box.appendChild(pile);
  }

  /* ---------- démarrage ---------- */
  function demarrer() {
    neige();
    if (charger() && save.seed) { try { recalculer(); } catch (e) { save = { seed: null, decisions: [], poste: null }; } }
    rendreAccueil();
    aller('accueil');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else demarrer();
})();
</script>
</body>
</html>
